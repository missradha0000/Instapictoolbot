<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />

  <meta
    name="theme-color"
    content="#ffffff"
  />

  <title>InstaPic | All Image Tools</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            techblue: "#1d7edb",
            emerald: "#10b981"
          }
        }
      }
    };
  </script>

  <style>
    /* =========================================================
       GLOBAL
    ========================================================= */

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      overscroll-behavior: none;
    }

    body {
      color: #111827;
      overflow-x: hidden;
    }

    button,
    iframe {
      font-family: inherit;
    }

    /* Prevent unwanted text selection on app controls */
    button,
    .tool-card,
    .app-logo {
      user-select: none;
      -webkit-user-select: none;
    }

    /* =========================================================
       APP CONTAINER
    ========================================================= */

    #app {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: #ffffff;
    }

    .app-shell {
      width: 100%;
      max-width: 450px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      background: #ffffff;
      position: relative;
    }

    /* =========================================================
       DASHBOARD
    ========================================================= */

    #dashboard {
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        max(22px, env(safe-area-inset-top))
        18px
        0
        18px;

      display: flex;
      flex-direction: column;

      opacity: 1;
      visibility: visible;
      transition:
        opacity 0.18s ease,
        visibility 0.18s ease;
    }

    #dashboard.hidden-page {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      position: absolute;
      inset: 0;
    }

    /* =========================================================
       BRAND HEADER
    ========================================================= */

    .brand-header {
      padding: 8px 4px 26px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .app-logo {
      width: 50px;
      height: 50px;
      flex: 0 0 50px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 15px;

      background:
        linear-gradient(
          145deg,
          #1d7edb 0%,
          #2188e9 55%,
          #10b981 100%
        );

      box-shadow:
        0 8px 22px rgba(29, 126, 219, 0.18);

      position: relative;
      overflow: hidden;
    }

    .app-logo::after {
      content: "";
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      top: -42px;
      right: -28px;
    }

    .app-logo svg {
      width: 27px;
      height: 27px;
      position: relative;
      z-index: 2;
    }

    .brand-title {
      margin: 0;

      font-size: 21px;
      line-height: 1.2;
      font-weight: 750;
      letter-spacing: -0.45px;

      color: #111827;
    }

    .brand-subtitle {
      margin: 5px 0 0;

      font-size: 12.5px;
      line-height: 1.4;
      font-weight: 500;

      color: #8992a1;
    }

    /* =========================================================
       SECTION TITLE
    ========================================================= */

    .tools-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 3px 12px;
    }

    .tools-heading h3 {
      margin: 0;

      font-size: 14px;
      line-height: 1.3;
      font-weight: 700;

      color: #374151;
    }

    .tools-heading span {
      font-size: 11px;
      font-weight: 600;
      color: #a0a7b3;
    }

    /* =========================================================
       TOOL GRID
    ========================================================= */

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    /* =========================================================
       TOOL CARD
    ========================================================= */

    .tool-card {
      appearance: none;
      -webkit-appearance: none;

      width: 100%;
      min-height: 152px;

      border: 1px solid #e9edf2;
      border-radius: 18px;

      background: #ffffff;

      padding: 17px 15px;

      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;

      text-align: left;

      cursor: pointer;

      box-shadow:
        0 3px 12px rgba(17, 24, 39, 0.045);

      transition:
        transform 0.16s ease,
        box-shadow 0.16s ease,
        border-color 0.16s ease,
        background 0.16s ease;
    }

    .tool-card:hover {
      transform: translateY(-2px);

      border-color: #d8e5f1;

      box-shadow:
        0 8px 22px rgba(17, 24, 39, 0.075);
    }

    .tool-card:active {
      transform: scale(0.95);
      box-shadow:
        0 2px 8px rgba(17, 24, 39, 0.05);
    }

    .tool-card:focus-visible {
      outline: 3px solid rgba(29, 126, 219, 0.18);
      outline-offset: 2px;
    }

    /* =========================================================
       TOOL ICON
    ========================================================= */

    .tool-icon {
      width: 47px;
      height: 47px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      background: #f3f8fc;

      font-size: 24px;
      line-height: 1;

      box-shadow:
        inset 0 0 0 1px rgba(29, 126, 219, 0.035);
    }

    .tool-card:nth-child(2) .tool-icon {
      background: #f1fbf7;
    }

    .tool-card:nth-child(3) .tool-icon {
      background: #f4f8ff;
    }

    .tool-card:nth-child(4) .tool-icon {
      background: #f8f6ff;
    }

    /* =========================================================
       TOOL TEXT
    ========================================================= */

    .tool-info {
      width: 100%;
      margin-top: 14px;
    }

    .tool-name {
      margin: 0;

      font-size: 14px;
      line-height: 1.3;
      font-weight: 700;

      color: #172033;
    }

    .tool-description {
      margin: 5px 0 0;

      font-size: 11.5px;
      line-height: 1.35;
      font-weight: 500;

      color: #8b94a3;
    }

    /* =========================================================
       BOTTOM SAFE SPACE
       h-24 equivalent = 6rem
    ========================================================= */

    .bottom-space {
      height: 6rem;
      min-height: 6rem;
      flex-shrink: 0;
    }

    /* =========================================================
       TOOL VIEWER
    ========================================================= */

    #toolViewer {
      position: fixed;
      inset: 0;

      z-index: 9999;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      background: #ffffff;

      display: flex;
      flex-direction: column;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transform: translateZ(0);

      transition:
        opacity 0.16s ease,
        visibility 0.16s ease;
    }

    #toolViewer.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* =========================================================
       TOOL HEADER
    ========================================================= */

    .viewer-header {
      width: 100%;

      min-height: 58px;

      padding:
        env(safe-area-inset-top)
        12px
        0
        12px;

      display: flex;
      align-items: center;

      background: rgba(255, 255, 255, 0.97);

      border-bottom: 1px solid #edf0f3;

      flex-shrink: 0;

      z-index: 2;
    }

    .viewer-header-inner {
      width: 100%;
      min-height: 58px;

      display: flex;
      align-items: center;
    }

    /* =========================================================
       BACK BUTTON
    ========================================================= */

    .back-button {
      appearance: none;
      -webkit-appearance: none;

      border: 0;
      background: transparent;

      min-width: 46px;
      min-height: 44px;

      padding: 8px 10px;

      margin: 0 4px 0 0;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      color: #1d7edb;

      cursor: pointer;

      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    .back-button:hover {
      background: #f3f8fc;
    }

    .back-button:active {
      transform: scale(0.92);
      background: #edf5fb;
    }

    .back-button:focus-visible {
      outline: 3px solid rgba(29, 126, 219, 0.16);
    }

    .back-button svg {
      width: 22px;
      height: 22px;
      stroke-width: 2.2;
    }

    /* =========================================================
       CURRENT TOOL TITLE
    ========================================================= */

    #currentToolTitle {
      margin: 0;

      min-width: 0;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: 16px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.15px;

      color: #172033;
    }

    /* =========================================================
       IFRAME
    ========================================================= */

    #toolFrame {
      display: block;

      width: 100%;
      flex: 1 1 auto;

      min-height: 0;

      border: none;
      outline: none;

      background: #ffffff;

      overflow: auto;

      -webkit-overflow-scrolling: touch;

      /* Prevent iframe from creating weird inline gaps */
      vertical-align: top;
    }

    /* =========================================================
       RESPONSIVE ADJUSTMENTS
    ========================================================= */

    @media (max-width: 340px) {
      #dashboard {
        padding-left: 13px;
        padding-right: 13px;
      }

      .tools-grid {
        gap: 9px;
      }

      .tool-card {
        min-height: 145px;
        padding: 14px 12px;
      }

      .tool-icon {
        width: 43px;
        height: 43px;
        font-size: 22px;
      }

      .brand-title {
        font-size: 19px;
      }
    }

    @media (min-width: 451px) {
      body {
        background: #f3f5f7;
      }

      #app {
        max-width: 450px;
        margin: 0 auto;
        box-shadow:
          0 0 40px rgba(17, 24, 39, 0.06);
      }

      #toolViewer {
        max-width: 450px;
        left: 50%;
        right: auto;
        transform: translateX(-50%) translateZ(0);
      }
    }

    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <div id="app" class="app-shell">

    <!-- =======================================================
         HOME DASHBOARD PAGE
    ======================================================== -->

    <main id="dashboard">

      <!-- Brand -->
      <header class="brand-header">

        <div class="brand-row">

          <!-- Stylized image/lightning logo -->
          <div class="app-logo" aria-hidden="true">

            <svg
              viewBox="0 0 32 32"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <!-- Image frame -->
              <rect
                x="5"
                y="6"
                width="22"
                height="20"
                rx="4"
                stroke="white"
                stroke-width="2"
              />

              <!-- Mountain -->
              <path
                d="M8 22L13.2 16.3C13.55 15.92 14.18 15.92 14.53 16.3L17.2 19.2L19.1 17.15C19.48 16.74 20.14 16.76 20.48 17.19L24 22"
                stroke="white"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />

              <!-- Sun -->
              <circle
                cx="21.5"
                cy="11.5"
                r="2"
                fill="white"
              />

              <!-- Lightning -->
              <path
                d="M16.5 3L12.7 10.2H16L13.9 14"
                stroke="white"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

          </div>

          <div>
            <h1 class="brand-title">
              InstaPic | All Image Tools
            </h1>

            <p class="brand-subtitle">
              Serverless, Ultra-fast &amp; 100% Secure
            </p>
          </div>

        </div>

      </header>


      <!-- Tools heading -->
      <div class="tools-heading">
        <h3>Image Tools</h3>
        <span>4 Tools</span>
      </div>


      <!-- =====================================================
           EXACTLY 4 TOOL CARDS
      ====================================================== -->

      <section
        class="tools-grid"
        aria-label="Image tools"
      >

        <!-- 1. Image Compressor -->
        <button
          type="button"
          class="tool-card"
          onclick="openTool('compressor.html', 'Image Compressor')"
          aria-label="Open Image Compressor"
        >

          <div class="tool-icon" aria-hidden="true">
            🖼️
          </div>

          <div class="tool-info">
            <h2 class="tool-name">
              Image Compressor
            </h2>

            <p class="tool-description">
              KB साइज कम करें
            </p>
          </div>

        </button>


        <!-- 2. Image to PDF -->
        <button
          type="button"
          class="tool-card"
          onclick="openTool('image-to-pdf.html', 'Image to PDF')"
          aria-label="Open Image to PDF"
        >

          <div class="tool-icon" aria-hidden="true">
            📄
          </div>

          <div class="tool-info">
            <h2 class="tool-name">
              Image to PDF
            </h2>

            <p class="tool-description">
              फोटो को PDF बनाएं
            </p>
          </div>

        </button>


        <!-- 3. Format Converter -->
        <button
          type="button"
          class="tool-card"
          onclick="openTool('converter.html', 'Format Converter')"
          aria-label="Open Format Converter"
        >

          <div class="tool-icon" aria-hidden="true">
            🔄
          </div>

          <div class="tool-info">
            <h2 class="tool-name">
              Format Converter
            </h2>

            <p class="tool-description">
              JPG, PNG, WebP बदलें
            </p>
          </div>

        </button>


        <!-- 4. Crop & Resize -->
        <button
          type="button"
          class="tool-card"
          onclick="openTool('resizer.html', 'Image Resizer')"
          aria-label="Open Image Resizer"
        >

          <div class="tool-icon" aria-hidden="true">
            ✂️
          </div>

          <div class="tool-info">
            <h2 class="tool-name">
              Crop &amp; Resize
            </h2>

            <p class="tool-description">
              फोटो काटें और स्केल करें
            </p>
          </div>

        </button>

      </section>


      <!-- Telegram bottom UI safe space -->
      <div
        class="bottom-space"
        aria-hidden="true"
      ></div>

    </main>


    <!-- =======================================================
         TOOL VIEWER PAGE
         Hidden by default
    ======================================================== -->

    <section
      id="toolViewer"
      aria-hidden="true"
    >

      <!-- Sticky viewer header -->
      <header class="viewer-header">

        <div class="viewer-header-inner">

          <!-- Back -->
          <button
            id="backButton"
            class="back-button"
            type="button"
            onclick="closeTool()"
            aria-label="Back to all image tools"
          >

            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M19 12H5"
                stroke="currentColor"
                stroke-linecap="round"
              />

              <path
                d="M11 18L5 12L11 6"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

          </button>


          <!-- Dynamic tool title -->
          <h2 id="currentToolTitle">
            Image Tool
          </h2>

        </div>

      </header>


      <!-- =====================================================
           TOOL IFRAME
           Standalone tool files are loaded here.
      ====================================================== -->

      <iframe
        id="toolFrame"
        title="Image Tool"
        class="w-full flex-1 border-none"
        src="about:blank"
        loading="eager"
        allow="clipboard-read; clipboard-write"
        referrerpolicy="no-referrer"
      ></iframe>

    </section>

  </div>


  <!-- =========================================================
       JAVASCRIPT
  ========================================================= -->

  <script>
    "use strict";

    /* =========================================================
       TELEGRAM WEB APP INITIALIZATION
    ========================================================= */

    const telegram = window.Telegram?.WebApp || null;

    if (telegram) {
      try {
        telegram.ready();
        telegram.expand();

        /*
         * Keep Telegram's native UI compatible with the
         * white application theme.
         */
        if (telegram.setHeaderColor) {
          telegram.setHeaderColor("#ffffff");
        }

        if (telegram.setBackgroundColor) {
          telegram.setBackgroundColor("#ffffff");
        }
      } catch (error) {
        console.warn(
          "Telegram WebApp initialization warning:",
          error
        );
      }
    }


    /* =========================================================
       DOM REFERENCES
    ========================================================= */

    const dashboard =
      document.getElementById("dashboard");

    const toolViewer =
      document.getElementById("toolViewer");

    const toolFrame =
      document.getElementById("toolFrame");

    const currentToolTitle =
      document.getElementById("currentToolTitle");


    /* =========================================================
       OPEN TOOL
       
       fileName = standalone HTML file
       title    = title displayed in viewer header
    ========================================================= */

    function openTool(fileName, title) {

      /*
       * Basic protection against empty values.
       */
      if (!fileName || !title) {
        console.error(
          "openTool() requires both fileName and title."
        );
        return;
      }

      /*
       * Update viewer title first.
       */
      currentToolTitle.textContent = title;

      /*
       * Update iframe accessibility title.
       */
      toolFrame.title = title;

      /*
       * Load the standalone tool.
       *
       * Example:
       * compressor.html
       * image-to-pdf.html
       * converter.html
       * resizer.html
       */
      toolFrame.src = fileName;

      /*
       * Hide dashboard.
       */
      dashboard.classList.add("hidden-page");

      /*
       * Show tool viewer.
       */
      toolViewer.classList.add("active");

      toolViewer.setAttribute(
        "aria-hidden",
        "false"
      );

      /*
       * Prevent background page scrolling.
       */
      document.body.style.overflow = "hidden";

      /*
       * Scroll iframe/document to top when opening.
       */
      try {
        toolFrame.scrollTop = 0;
      } catch (error) {
        // Safe to ignore.
      }
    }


    /* =========================================================
       CLOSE TOOL
    ========================================================= */

    function closeTool() {

      /*
       * IMPORTANT:
       *
       * Removing the iframe src releases the loaded tool
       * document and helps free memory on mobile devices.
       */
      toolFrame.src = "about:blank";

      /*
       * Reset title.
       */
      currentToolTitle.textContent = "Image Tool";

      toolFrame.title = "Image Tool";

      /*
       * Hide viewer.
       */
      toolViewer.classList.remove("active");

      toolViewer.setAttribute(
        "aria-hidden",
        "true"
      );

      /*
       * Restore dashboard.
       */
      dashboard.classList.remove("hidden-page");

      /*
       * Restore normal page scrolling.
       */
      document.body.style.overflow = "";

      /*
       * Return focus to the dashboard when possible.
       */
      try {
        document.body.focus();
      } catch (error) {
        // Safe to ignore.
      }
    }


    /* =========================================================
       ANDROID BACK BUTTON / BROWSER HISTORY SUPPORT
       
       When a user opens a tool, add a temporary history state.
       Pressing the Android/browser back button then closes the
       tool instead of leaving the Mini App immediately.
    ========================================================= */

    let toolIsOpen = false;


    const originalOpenTool = openTool;

    window.openTool = function(fileName, title) {

      if (!toolIsOpen) {
        try {
          history.pushState(
            {
              instaPicTool: true
            },
            "",
            window.location.href
          );
        } catch (error) {
          // History API may be restricted in some WebViews.
        }

        toolIsOpen = true;
      }

      originalOpenTool(fileName, title);
    };


    const originalCloseTool = closeTool;

    window.closeTool = function() {

      /*
       * Only go back in history if this viewer created
       * the history entry.
       */
      if (toolIsOpen) {
        toolIsOpen = false;

        try {
          history.back();
          return;
        } catch (error) {
          // Fall through to direct close.
        }
      }

      originalCloseTool();
    };


    /* =========================================================
       HISTORY BACK HANDLER
    ========================================================= */

    window.addEventListener(
      "popstate",
      function() {

        if (toolIsOpen) {
          toolIsOpen = false;

          originalCloseTool();
        }

      }
    );


    /* =========================================================
       KEYBOARD ESCAPE
       
       Useful on desktop/testing environments.
    ========================================================= */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Escape" &&
          toolViewer.classList.contains("active")
        ) {
          window.closeTool();
        }

      }
    );


    /* =========================================================
       INITIAL STATE
    ========================================================= */

    dashboard.classList.remove("hidden-page");

    toolViewer.classList.remove("active");

    toolViewer.setAttribute(
      "aria-hidden",
      "true"
    );

  </script>

</body>
</html>
