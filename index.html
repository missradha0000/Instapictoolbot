<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>InstaPic | All Image Tools</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#08172d}
body{overflow-x:hidden}
button{font-family:inherit}
#app{width:100%;max-width:450px;min-height:100vh;min-height:100dvh;margin:auto;background:#fff;position:relative}
#home{min-height:100vh;min-height:100dvh;padding:max(20px,env(safe-area-inset-top)) 18px 0;transition:opacity .16s ease,visibility .16s ease}
#home.hidden{opacity:0;visibility:hidden;pointer-events:none;position:absolute;inset:0}

.logo-wrap{display:flex;justify-content:center;align-items:center;margin:5px 0 13px}
.logo{width:105px;height:105px;object-fit:contain;display:block}

.brand{text-align:center}
.brand h1{margin:0;font-size:25px;line-height:1.2;font-weight:800;letter-spacing:-.7px;color:#071b35}
.brand h1 .blue{color:#176db5}
.brand p{margin:7px 0 0;font-size:15.5px;line-height:1.3;font-weight:700;color:#101b2d}
.brand p .green{color:#10a866}

.tools{display:flex;flex-direction:column;gap:12px;margin-top:27px}

.tool-card{width:100%;min-height:116px;border:5px solid;border-radius:22px;background:#fff;padding:12px 16px;display:flex;align-items:center;text-align:left;cursor:pointer;transition:transform .14s ease,box-shadow .14s ease}
.tool-card:active{transform:scale(.965)}
.tool-card.green{border-color:#25b866;box-shadow:0 7px 22px rgba(37,184,102,.23)}
.tool-card.blue{border-color:#159bd8;box-shadow:0 7px 22px rgba(21,155,216,.23)}

.tool-icon{width:66px;height:66px;min-width:66px;border-radius:17px;display:flex;align-items:center;justify-content:center;margin-right:18px;color:#fff}
.green .tool-icon{background:linear-gradient(145deg,#3cc96e,#119b52)}
.blue .tool-icon{background:linear-gradient(145deg,#19b6eb,#087dcb)}
.tool-icon svg{width:39px;height:39px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.tool-content{min-width:0;flex:1}
.tool-title{margin:0;font-size:20px;line-height:1.18;font-weight:750;letter-spacing:-.3px;color:#08172d}
.tool-description{margin:4px 0 0;font-size:14px;line-height:1.25;font-weight:500;color:#101827}

.launch{width:100%;min-height:70px;margin-top:28px;border:1px solid #dbe2e8;border-radius:19px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.07);display:flex;align-items:center;justify-content:center;gap:10px;font-size:20px;font-weight:500;color:#23384f;cursor:pointer;transition:transform .14s ease,background .14s ease}
.launch:active{transform:scale(.97);background:#f7fafc}
.tg-icon{width:29px;height:29px;border-radius:50%;background:#229ed9;display:flex;align-items:center;justify-content:center}
.tg-icon svg{width:18px;height:18px;fill:#fff}

.bottom-space{height:6rem;min-height:6rem}

#toolViewer{position:fixed;inset:0;z-index:9999;width:100%;height:100vh;height:100dvh;background:#fff;display:flex;flex-direction:column;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .16s ease,visibility .16s ease}
#toolViewer.active{opacity:1;visibility:visible;pointer-events:auto}
.viewer-header{width:100%;padding-top:env(safe-area-inset-top);background:#fff;border-bottom:1px solid #edf0f3;flex-shrink:0}
.viewer-inner{min-height:58px;display:flex;align-items:center;padding:0 10px}
.back{width:45px;height:45px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#1679bd;cursor:pointer}
.back:active{background:#f1f7fb;transform:scale(.92)}
.back svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#currentToolTitle{margin:0 0 0 4px;font-size:17px;font-weight:700;color:#102039;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#toolFrame{width:100%;flex:1;min-height:0;border:0;outline:0;background:#fff;display:block;-webkit-overflow-scrolling:touch}

@media(max-width:350px){
#home{padding-left:13px;padding-right:13px}
.logo{width:92px;height:92px}
.brand h1{font-size:22px}
.brand p{font-size:14px}
.tool-card{min-height:108px;padding:10px 12px}
.tool-icon{width:58px;height:58px;min-width:58px;margin-right:13px}
.tool-title{font-size:17px}
.tool-description{font-size:12px}
.launch{font-size:17px}
}
@media(min-width:451px){
body{background:#eef1f4}
#app{box-shadow:0 0 40px rgba(0,0,0,.08)}
#toolViewer{max-width:450px;left:50%;right:auto;transform:translateX(-50%)}
}
</style>
</head>

        <svg viewBox="0 0 24 24">
          <path d="M19 12H5"/>
          <path d="M11 18l-6-6 6-6"/>
        </svg>
      </button>
      <h2 id="currentToolTitle">Image Tool</h2>
    </div>

    id="toolFrame"
    src="about:blank"
    title="Image Tool"
    loading="eager"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="no-referrer">
  </iframe>
</section>

</div>

<script>
"use strict";

const tg = window.Telegram?.WebApp || null;

if (tg) {
  try {
    tg.ready();
    tg.expand();
    tg.setHeaderColor?.("#ffffff");
    tg.setBackgroundColor?.("#ffffff");
  } catch (e) {
    console.warn("Telegram WebApp initialization warning:", e);
  }
}

const home = document.getElementById("home");
const viewer = document.getElementById("toolViewer");
const frame = document.getElementById("toolFrame");
const title = document.getElementById("currentToolTitle");

let currentToolOpen = false;
let historyEntryCreated = false;

function openTool(fileName, toolTitle) {
  if (!fileName || !toolTitle) return;

  title.textContent = toolTitle;
  frame.title = toolTitle;
  frame.src = fileName;

  home.classList.add("hidden");
  viewer.classList.add("active");
  viewer.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";

  currentToolOpen = true;

  if (!historyEntryCreated) {
    try {
      history.pushState({ instaPicTool: true }, "", window.location.href);
      historyEntryCreated = true;
    } catch (e) {}
  }
}

function closeTool(fromPopState = false) {
  frame.src = "about:blank";
  frame.title = "Image Tool";
  title.textContent = "Image Tool";

  viewer.classList.remove("active");
  viewer.setAttribute("aria-hidden", "true");
  home.classList.remove("hidden");
  document.body.style.overflow = "";

  currentToolOpen = false;

  if (!fromPopState && historyEntryCreated) {
    historyEntryCreated = false;
    try {
      history.back();
      return;
    } catch (e) {}
  }

  historyEntryCreated = false;
}

window.addEventListener("popstate", () => {
  if (currentToolOpen) closeTool(true);
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && currentToolOpen) closeTool();
});

function launchTelegramApp() {
  if (tg) {
    try {
      tg.HapticFeedback?.impactOccurred("light");
    } catch (e) {}
  }
}
</script>
