<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <title>Image to PDF Converter | InstaPic</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- jsPDF -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;

      background: #ffffff;

      font-family:
        Inter,
        Roboto,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #172033;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      -webkit-user-select: none;
      user-select: none;
    }

    .app {
      width: 100%;
      max-width: 620px;

      margin: 0 auto;

      padding:
        calc(20px + env(safe-area-inset-top))
        18px
        calc(100px + env(safe-area-inset-bottom));
    }

    /* =========================================
       HEADER
    ========================================= */

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 27px;
    }

    .logo {
      width: 46px;
      height: 46px;

      flex: 0 0 46px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;

      background: #eaf4ff;
      color: #1d7edb;

      font-size: 20px;
    }

    .brand-title {
      margin: 0;

      color: #1d7edb;

      font-size: 21px;
      line-height: 1.2;

      font-weight: 750;

      letter-spacing: -0.3px;
    }

    .brand-subtitle {
      margin: 4px 0 0;

      color: #8b95a3;

      font-size: 12.5px;
    }

    /* =========================================
       SELECT BUTTON
    ========================================= */

    .select-btn {
      width: 100%;
      min-height: 55px;

      border: 0;
      border-radius: 13px;

      background: #1d7edb;
      color: #ffffff;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 6px 18px rgba(29, 126, 219, 0.18);

      transition:
        transform 0.12s ease,
        opacity 0.15s ease;
    }

    .select-btn:active {
      transform: scale(0.98);
    }

    /* =========================================
       EMPTY STATE
    ========================================= */

    .empty-state {
      margin-top: 20px;

      padding: 30px 15px;

      border: 1px dashed #dfe5eb;

      border-radius: 13px;

      text-align: center;

      color: #9aa3af;

      font-size: 13px;

      line-height: 1.5;
    }

    .empty-state i {
      display: block;

      margin-bottom: 9px;

      color: #b8c1cb;

      font-size: 28px;
    }

    /* =========================================
       SELECTED IMAGES HEADER
    ========================================= */

    .selected-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-top: 20px;
      margin-bottom: 10px;
    }

    .selected-title {
      color: #303846;

      font-size: 14px;

      font-weight: 750;
    }

    .selected-count {
      padding: 5px 9px;

      border-radius: 999px;

      background: #edf7ff;

      color: #1d7edb;

      font-size: 11px;

      font-weight: 750;

      white-space: nowrap;
    }

    /* =========================================
       THUMBNAILS
    ========================================= */

    .preview-grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 9px;
    }

    .preview-card {
      position: relative;

      overflow: hidden;

      aspect-ratio: 1 / 1;

      border-radius: 11px;

      background: #f3f5f7;

      border: 1px solid #e3e7eb;
    }

    .preview-card img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }

    .preview-number {
      position: absolute;

      left: 6px;
      top: 6px;

      min-width: 23px;
      height: 23px;

      padding: 0 5px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 999px;

      background: rgba(0, 0, 0, 0.62);

      color: #ffffff;

      font-size: 10px;

      font-weight: 750;
    }

    /* =========================================
       CONVERT BUTTON
    ========================================= */

    .convert-btn {
      width: 100%;

      min-height: 53px;

      margin-top: 19px;

      border: 0;

      border-radius: 12px;

      background: #10b981;

      color: #ffffff;

      font-size: 15px;

      font-weight: 750;

      cursor: pointer;

      box-shadow:
        0 6px 18px rgba(16, 185, 129, 0.16);

      transition:
        transform 0.12s ease,
        opacity 0.15s ease;
    }

    .convert-btn:active {
      transform: scale(0.98);
    }

    .convert-btn:disabled {
      opacity: 0.65;

      cursor: not-allowed;
    }

    /* =========================================
       SPINNER
    ========================================= */

    .spinner {
      display: inline-block;

      width: 18px;
      height: 18px;

      margin-right: 7px;

      vertical-align: -4px;

      border:
        2px solid
        rgba(255, 255, 255, 0.4);

      border-top-color: #ffffff;

      border-radius: 50%;

      animation:
        spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================
       INFO
    ========================================= */

    .info-box {
      margin-top: 12px;

      padding: 11px 12px;

      border-radius: 10px;

      border: 1px solid #e4f0fb;

      background: #f7fbff;

      color: #738091;

      font-size: 12px;

      line-height: 1.5;
    }

    /* =========================================
       BOTTOM TELEGRAM SPACE
    ========================================= */

    .bottom-space {
      height: 96px;
    }

    @media (max-width: 380px) {

      .app {
        padding-left: 14px;
        padding-right: 14px;
      }

      .brand-title {
        font-size: 19px;
      }

      .preview-grid {
        gap: 7px;
      }

    }
  </style>
</head>

<body>

  <main class="app">

    <!-- =======================================
         HEADER
    ======================================== -->

    <header class="brand">

      <div class="logo">
        <i class="fa-solid fa-file-pdf"></i>
      </div>

      <div>

        <h1 class="brand-title">
          Image to PDF Converter
        </h1>

        <p class="brand-subtitle">
          Fast, Simple &amp; 100% Client-Side
        </p>

      </div>

    </header>


    <!-- =======================================
         FILE INPUT
         
         MULTIPLE IS IMPORTANT
    ======================================== -->

    <input
      id="imageInput"
      type="file"
      accept="image/jpeg,image/png,image/webp"
      multiple
      hidden
    >


    <!-- =======================================
         SELECT IMAGES
    ======================================== -->

    <button
      id="selectBtn"
      class="select-btn"
      type="button"
    >

      <i class="fa-solid fa-folder-open mr-2"></i>

      Select Images

    </button>


    <!-- =======================================
         EMPTY STATE
    ======================================== -->

    <div
      id="emptyState"
      class="empty-state"
    >

      <i class="fa-regular fa-images"></i>

      Select one or more images to create a PDF.

    </div>


    <!-- =======================================
         IMAGE PREVIEWS
    ======================================== -->

    <section
      id="previewSection"
      class="hidden"
    >

      <div class="selected-header">

        <div class="selected-title">
          Selected Images
        </div>

        <div
          id="selectedCount"
          class="selected-count"
        >
          0 Images Selected
        </div>

      </div>


      <div
        id="previewGrid"
        class="preview-grid"
      ></div>


      <!-- =====================================
           CONVERT TO PDF
      ====================================== -->

      <button
        id="convertBtn"
        class="convert-btn"
        type="button"
      >

        <i class="fa-solid fa-file-pdf mr-2"></i>

        Convert to PDF

      </button>


      <!-- =====================================
           SECURITY INFO
      ====================================== -->

      <div class="info-box">

        <i class="fa-solid fa-shield-halved mr-1"></i>

        Your images are processed locally on your
        device. Nothing is uploaded to a server.

      </div>

    </section>


    <!-- TELEGRAM SAFE BOTTOM SPACE -->

    <div class="bottom-space"></div>

  </main>


  <script>
    (() => {

      "use strict";


      /* =====================================================
         TELEGRAM MINI APP INITIALIZATION
      ===================================================== */

      const tg =
        window.Telegram &&
        window.Telegram.WebApp;


      if (tg) {

        try {

          tg.ready();

          tg.expand();


          if (
            typeof tg.setHeaderColor ===
            "function"
          ) {

            tg.setHeaderColor(
              "#ffffff"
            );

          }


          if (
            typeof tg.setBackgroundColor ===
            "function"
          ) {

            tg.setBackgroundColor(
              "#ffffff"
            );

          }


          if (
            typeof tg.setBottomBarColor ===
            "function"
          ) {

            tg.setBottomBarColor(
              "#ffffff"
            );

          }

        } catch (error) {

          console.warn(
            "Telegram WebApp setup:",
            error
          );

        }

      }


      /* =====================================================
         DOM
      ===================================================== */

      const imageInput =
        document.getElementById(
          "imageInput"
        );

      const selectBtn =
        document.getElementById(
          "selectBtn"
        );

      const emptyState =
        document.getElementById(
          "emptyState"
        );

      const previewSection =
        document.getElementById(
          "previewSection"
        );

      const previewGrid =
        document.getElementById(
          "previewGrid"
        );

      const selectedCount =
        document.getElementById(
          "selectedCount"
        );

      const convertBtn =
        document.getElementById(
          "convertBtn"
        );


      /* =====================================================
         STATE
      ===================================================== */

      let selectedFiles = [];

      let previewURLs = [];


      /*
       * Maximum image working dimension.
       *
       * This is intentionally limited because a phone camera
       * can easily produce 6000x4000 or larger images.
       */
      const MAX_IMAGE_DIMENSION = 4096;


      /*
       * A4 dimensions in millimetres.
       */
      const A4_WIDTH = 210;
      const A4_HEIGHT = 297;

      const PAGE_MARGIN = 10;


      /* =====================================================
         SELECT BUTTON
      ===================================================== */

      selectBtn.addEventListener(
        "click",
        () => {

          /*
           * Reset input so the user can select the same
           * images again.
           */
          imageInput.value = "";

          imageInput.click();

        }
      );


      /* =====================================================
         IMAGE SELECTION
      ===================================================== */

      imageInput.addEventListener(
        "change",
        event => {

          const files =
            Array.from(
              event.target.files || []
            );


          if (!files.length) {
            return;
          }


          /*
           * Only accept supported image types.
           */
          const validFiles =
            files.filter(
              file =>
                [
                  "image/jpeg",
                  "image/png",
                  "image/webp"
                ].includes(
                  file.type
                )
            );


          if (!validFiles.length) {

            alert(
              "Please select JPG, PNG or WebP images."
            );

            return;

          }


          selectedFiles =
            validFiles;


          renderPreviews();

        }
      );


      /* =====================================================
         RENDER THUMBNAILS
      ===================================================== */

      function renderPreviews() {

        /*
         * Release old preview URLs.
         */
        previewURLs.forEach(
          url =>
            URL.revokeObjectURL(
              url
            )
        );


        previewURLs = [];


        previewGrid.innerHTML =
          "";


        selectedFiles.forEach(
          (file, index) => {

            const url =
              URL.createObjectURL(
                file
              );


            previewURLs.push(
              url
            );


            const card =
              document.createElement(
                "div"
              );


            card.className =
              "preview-card";


            const img =
              document.createElement(
                "img"
              );


            img.src =
              url;


            img.alt =
              "Image " +
              (index + 1);


            img.loading =
              index < 6
                ? "eager"
                : "lazy";


            const number =
              document.createElement(
                "div"
              );


            number.className =
              "preview-number";


            number.textContent =
              index + 1;


            card.appendChild(
              img
            );


            card.appendChild(
              number
            );


            previewGrid.appendChild(
              card
            );

          }
        );


        const count =
          selectedFiles.length;


        selectedCount.textContent =
          count +
          (count === 1
            ? " Image Selected"
            : " Images Selected");


        emptyState.classList.add(
          "hidden"
        );


        previewSection.classList.remove(
          "hidden"
        );

      }


      /* =====================================================
         LOAD IMAGE
      ===================================================== */

      function loadImage(
        file
      ) {

        return new Promise(
          (resolve, reject) => {

            const url =
              URL.createObjectURL(
                file
              );


            const img =
              new Image();


            img.onload =
              () => {

                URL.revokeObjectURL(
                  url
                );


                resolve(img);

              };


            img.onerror =
              () => {

                URL.revokeObjectURL(
                  url
                );


                reject(
                  new Error(
                    "Could not read image."
                  )
                );

              };


            img.src =
              url;

          }
        );

      }


      /* =====================================================
         SAFE IMAGE SIZE
         
         Prevents huge camera images from creating
         dangerous canvas allocations.
      ===================================================== */

      function getSafeDimensions(
        width,
        height
      ) {

        let newWidth =
          width;

        let newHeight =
          height;


        if (
          width >
            MAX_IMAGE_DIMENSION ||
          height >
            MAX_IMAGE_DIMENSION
        ) {

          const scale =
            Math.min(
              MAX_IMAGE_DIMENSION /
                width,

              MAX_IMAGE_DIMENSION /
                height
            );


          newWidth =
            Math.max(
              1,
              Math.round(
                width * scale
              )
            );


          newHeight =
            Math.max(
              1,
              Math.round(
                height * scale
              )
            );

        }


        return {
          width:
            newWidth,

          height:
            newHeight
        };

      }


      /* =====================================================
         IMAGE → JPEG DATA URL
         
         PDF pages are generated from JPEG data.
         JPEG keeps the resulting PDF much smaller than
         embedding full PNG camera images.
      ===================================================== */

      function imageToJPEG(
        img
      ) {

        const dimensions =
          getSafeDimensions(
            img.naturalWidth,
            img.naturalHeight
          );


        const canvas =
          document.createElement(
            "canvas"
          );


        canvas.width =
          dimensions.width;


        canvas.height =
          dimensions.height;


        const ctx =
          canvas.getContext(
            "2d"
          );


        if (!ctx) {

          throw new Error(
            "Canvas is not supported."
          );

        }


        /*
         * White background prevents transparent PNG/WebP
         * images from appearing black in the PDF.
         */
        ctx.fillStyle =
          "#ffffff";


        ctx.fillRect(
          0,
          0,
          canvas.width,
          canvas.height
        );


        ctx.imageSmoothingEnabled =
          true;


        ctx.imageSmoothingQuality =
          "high";


        ctx.drawImage(
          img,

          0,
          0,

          canvas.width,
          canvas.height
        );


        return {
          data:
            canvas.toDataURL(
              "image/jpeg",
              0.90
            ),

          width:
            dimensions.width,

          height:
            dimensions.height
        };

      }


      /* =====================================================
         CALCULATE A4 FIT
      ===================================================== */

      function calculateA4Fit(
        imageWidth,
        imageHeight
      ) {

        const availableWidth =
          A4_WIDTH -
          PAGE_MARGIN * 2;


        const availableHeight =
          A4_HEIGHT -
          PAGE_MARGIN * 2;


        const imageRatio =
          imageWidth /
          imageHeight;


        const pageRatio =
          availableWidth /
          availableHeight;


        let width;
        let height;


        if (
          imageRatio >
          pageRatio
        ) {

          width =
            availableWidth;


          height =
            width /
            imageRatio;

        } else {

          height =
            availableHeight;


          width =
            height *
            imageRatio;

        }


        return {
          width,
          height,

          x:
            (A4_WIDTH -
              width) /
            2,

          y:
            (A4_HEIGHT -
              height) /
            2
        };

      }


      /* =====================================================
         SMALL YIELD
         
         Lets Telegram/mobile browser remain responsive
         while multiple large images are processed.
      ===================================================== */

      function yieldToBrowser() {

        return new Promise(
          resolve => {

            if (
              typeof requestAnimationFrame ===
              "function"
            ) {

              requestAnimationFrame(
                () => resolve()
              );

            } else {

              setTimeout(
                resolve,
                0
              );

            }

          }
        );

      }


      /* =====================================================
         CREATE PDF
      ===================================================== */

      async function createPDF() {

        /*
         * Verify jsPDF loaded.
         */
        if (
          !window.jspdf ||
          !window.jspdf.jsPDF
        ) {

          throw new Error(
            "PDF library could not be loaded."
          );

        }


        const {
          jsPDF
        } =
          window.jspdf;


        /*
         * A4 portrait PDF.
         *
         * Each image gets its own A4 page.
         */
        const pdf =
          new jsPDF({
            orientation:
              "portrait",

            unit:
              "mm",

            format:
              "a4",

            compress:
              true
          });


        for (
          let i = 0;
          i < selectedFiles.length;
          i++
        ) {

          /*
           * Keep Telegram UI responsive between images.
           */
          await yieldToBrowser();


          const img =
            await loadImage(
              selectedFiles[i]
            );


          const converted =
            imageToJPEG(
              img
            );


          /*
           * First image uses the document's initial page.
           * Every following image creates a new A4 page.
           */
          if (i > 0) {

            pdf.addPage(
              "a4",
              "portrait"
            );

          }


          const fit =
            calculateA4Fit(
              converted.width,
              converted.height
            );


          pdf.addImage(
            converted.data,

            "JPEG",

            fit.x,
            fit.y,

            fit.width,
            fit.height,

            undefined,

            "FAST"
          );

        }


        return pdf;

      }


      /* =====================================================
         TELEGRAM / MOBILE PDF DOWNLOAD
         
         IMPORTANT:
         
         Telegram WebView does not always handle:
         
             <a download="file.pdf">
         
         the same way as desktop Chrome.
         
         Therefore we first try the native File Share API.
         
         If unavailable, we use the standard download.
         
         If that is blocked by the WebView, the PDF is opened
         as a Blob URL so the user can save/share it using the
         native viewer.
      ===================================================== */

      async function downloadPDF(
        pdf
      ) {

        /*
         * jsPDF generates a Blob directly.
         */
        const blob =
          pdf.output(
            "blob"
          );


        if (
          !blob ||
          blob.size <= 0
        ) {

          throw new Error(
            "Generated PDF is empty."
          );

        }


        const filename =
          "instapic_document.pdf";


        /* =================================================
           METHOD 1 — NATIVE MOBILE SHARE
        ================================================= */

        if (
          typeof navigator.share ===
          "function"
        ) {

          try {

            const file =
              new File(
                [blob],
                filename,
                {
                  type:
                    "application/pdf"
                }
              );


            let canShare =
              true;


            if (
              typeof navigator.canShare ===
              "function"
            ) {

              canShare =
                navigator.canShare({
                  files: [file]
                });

            }


            if (canShare) {

              await navigator.share({

                files: [file],

                title:
                  "InstaPic PDF",

                text:
                  "Generated by InstaPic"

              });


              return;

            }

          } catch (error) {

            /*
             * User closed the native share sheet.
             */
            if (
              error &&
              error.name ===
                "AbortError"
            ) {

              return;

            }


            console.warn(
              "Native PDF sharing unavailable:",
              error
            );

          }

        }


        /* =================================================
           METHOD 2 — STANDARD BROWSER DOWNLOAD
        ================================================= */

        const url =
          URL.createObjectURL(
            blob
          );


        try {

          const link =
            document.createElement(
              "a"
            );


          link.href =
            url;


          link.download =
            filename;


          link.rel =
            "noopener";


          link.style.position =
            "fixed";


          link.style.left =
            "-9999px";


          link.style.top =
            "0";


          document.body.appendChild(
            link
          );


          /*
           * Normal click.
           */
          link.click();


          /*
           * Additional click event for embedded WebViews.
           */
          try {

            link.dispatchEvent(
              new MouseEvent(
                "click",
                {
                  bubbles: true,
                  cancelable: true,
                  view: window
                }
              )
            );

          } catch (_) {}


          link.remove();


          /*
           * Do not revoke immediately.
           */
          setTimeout(
            () => {

              URL.revokeObjectURL(
                url
              );

            },
            15000
          );


          return;

        } catch (error) {

          console.warn(
            "Standard PDF download failed:",
            error
          );

        }


        /* =================================================
           METHOD 3 — WEBVIEW FALLBACK
        ================================================= */

        try {

          /*
           * Open the PDF Blob in the WebView/browser.
           * Telegram/Android can then provide its native
           * viewer/share/save interface.
           */
          window.open(
            url,
            "_blank"
          );


          setTimeout(
            () => {

              URL.revokeObjectURL(
                url
              );

            },
            30000
          );

        } catch (error) {

          URL.revokeObjectURL(
            url
          );

          throw error;

        }

      }


      /* =====================================================
         CONVERT BUTTON
      ===================================================== */

      convertBtn.addEventListener(
        "click",
        async () => {

          if (
            !selectedFiles.length
          ) {

            alert(
              "Please select at least one image."
            );

            return;

          }


          const originalHTML =
            convertBtn.innerHTML;


          convertBtn.disabled =
            true;


          convertBtn.innerHTML =
            '<span class="spinner"></span>Creating PDF...';


          try {

            /*
             * Let loading UI render before processing.
             */
            await yieldToBrowser();


            const pdf =
              await createPDF();


            convertBtn.innerHTML =
              '<span class="spinner"></span>Preparing Download...';


            await yieldToBrowser();


            /*
             * Generate/download the PDF.
             */
            await downloadPDF(
              pdf
            );


            /* =============================================
               SUCCESS
            ============================================= */

            convertBtn.innerHTML =
              '<i class="fa-solid fa-check mr-2"></i>PDF Ready';


            /*
             * Reset after successful generation.
             */
            setTimeout(
              () => {

                resetTool();

              },
              1400
            );


          } catch (error) {

            console.error(
              "PDF conversion error:",
              error
            );


            alert(
              "Could not create the PDF. Please try again with different images."
            );


            convertBtn.innerHTML =
              originalHTML;


            convertBtn.disabled =
              false;

          }

        }
      );


      /* =====================================================
         RESET TOOL
      ===================================================== */

      function resetTool() {

        /*
         * Release all preview object URLs.
         */
        previewURLs.forEach(
          url =>
            URL.revokeObjectURL(
              url
            )
        );


        previewURLs =
          [];


        selectedFiles =
          [];


        previewGrid.innerHTML =
          "";


        selectedCount.textContent =
          "0 Images Selected";


        previewSection.classList.add(
          "hidden"
        );


        emptyState.classList.remove(
          "hidden"
        );


        imageInput.value =
          "";


        convertBtn.disabled =
          false;


        convertBtn.innerHTML =
          '<i class="fa-solid fa-file-pdf mr-2"></i>Convert to PDF';

      }


      /* =====================================================
         CLEANUP
      ===================================================== */

      window.addEventListener(
        "beforeunload",
        () => {

          previewURLs.forEach(
            url =>
              URL.revokeObjectURL(
                url
              )
          );

          previewURLs =
            [];

        }
      );


    })();
  </script>

</body>
</html>
