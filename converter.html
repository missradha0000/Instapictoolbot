<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <title>Image Format Converter | InstaPic</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;

      background: #ffffff;

      font-family:
        Inter,
        Roboto,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #172033;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      -webkit-user-select: none;
      user-select: none;
    }

    .app {
      width: 100%;
      max-width: 620px;

      margin: 0 auto;

      padding:
        calc(20px + env(safe-area-inset-top))
        18px
        calc(100px + env(safe-area-inset-bottom));
    }

    /* =========================
       HEADER
    ========================== */

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 27px;
    }

    .logo {
      width: 46px;
      height: 46px;

      flex: 0 0 46px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;

      background: #eaf4ff;
      color: #1d7edb;

      font-size: 20px;
    }

    .brand-title {
      margin: 0;

      color: #1d7edb;

      font-size: 21px;
      line-height: 1.2;

      font-weight: 750;

      letter-spacing: -0.3px;
    }

    .brand-subtitle {
      margin: 4px 0 0;

      color: #8b95a3;

      font-size: 12.5px;
    }

    /* =========================
       SELECT BUTTON
    ========================== */

    .select-btn {
      width: 100%;
      min-height: 55px;

      border: 0;
      border-radius: 13px;

      background: #1d7edb;
      color: #ffffff;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 6px 18px rgba(29, 126, 219, 0.18);

      transition:
        transform 0.12s ease,
        opacity 0.15s ease;
    }

    .select-btn:active {
      transform: scale(0.98);
    }

    /* =========================
       EMPTY STATE
    ========================== */

    .empty-state {
      margin-top: 20px;

      padding: 30px 15px;

      border: 1px dashed #dfe5eb;

      border-radius: 13px;

      text-align: center;

      color: #9aa3af;

      font-size: 13px;

      line-height: 1.5;
    }

    .empty-state i {
      display: block;

      margin-bottom: 9px;

      color: #b8c1cb;

      font-size: 28px;
    }

    /* =========================
       PREVIEW
    ========================== */

    .preview-card {
      margin-top: 20px;

      padding: 12px;

      border: 1px solid #e3e8ed;

      border-radius: 14px;

      background: #ffffff;
    }

    .preview-image-wrap {
      width: 100%;

      min-height: 210px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      border-radius: 10px;

      background:
        linear-gradient(
          45deg,
          #f1f3f5 25%,
          transparent 25%
        ),
        linear-gradient(
          -45deg,
          #f1f3f5 25%,
          transparent 25%
        ),
        linear-gradient(
          45deg,
          transparent 75%,
          #f1f3f5 75%
        ),
        linear-gradient(
          -45deg,
          transparent 75%,
          #f1f3f5 75%
        );

      background-size: 20px 20px;

      background-position:
        0 0,
        0 10px,
        10px -10px,
        -10px 0;
    }

    .preview-image {
      display: block;

      max-width: 100%;
      max-height: 430px;

      width: auto;
      height: auto;

      object-fit: contain;
    }

    .file-info {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-top: 11px;
    }

    .file-name {
      min-width: 0;

      overflow: hidden;

      color: #4f5b6b;

      font-size: 12px;

      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .format-badge {
      flex: 0 0 auto;

      padding: 5px 9px;

      border-radius: 999px;

      background: #edf7ff;

      color: #1d7edb;

      font-size: 11px;

      font-weight: 750;
    }

    /* =========================
       FORMAT SECTION
    ========================== */

    .section-title {
      margin-top: 20px;

      color: #303846;

      font-size: 14px;

      font-weight: 700;
    }

    .format-grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 9px;

      margin-top: 10px;
    }

    .format-btn {
      min-height: 47px;

      border-radius: 10px;

      border: 1px solid #dfe4ea;

      background: #ffffff;

      color: #596575;

      font-size: 13px;

      font-weight: 750;

      cursor: pointer;

      transition:
        all 0.15s ease;
    }

    .format-btn:active {
      transform: scale(0.97);
    }

    .format-btn.active {
      border-color: #1d7edb;

      background: #edf7ff;

      color: #1d7edb;
    }

    /* =========================
       CONVERT BUTTON
    ========================== */

    .convert-btn {
      width: 100%;

      min-height: 53px;

      margin-top: 19px;

      border: 0;

      border-radius: 12px;

      background: #10b981;

      color: #ffffff;

      font-size: 15px;

      font-weight: 750;

      cursor: pointer;

      box-shadow:
        0 6px 18px rgba(16, 185, 129, 0.16);

      transition:
        transform 0.12s ease,
        opacity 0.15s ease;
    }

    .convert-btn:active {
      transform: scale(0.98);
    }

    .convert-btn:disabled {
      opacity: 0.65;

      cursor: not-allowed;
    }

    /* =========================
       LOADING SPINNER
    ========================== */

    .spinner {
      display: inline-block;

      width: 18px;
      height: 18px;

      margin-right: 7px;

      vertical-align: -4px;

      border:
        2px solid
        rgba(255, 255, 255, 0.4);

      border-top-color: #ffffff;

      border-radius: 50%;

      animation:
        spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       SECURITY INFO
    ========================== */

    .info-box {
      margin-top: 12px;

      padding: 11px 12px;

      border-radius: 10px;

      border: 1px solid #e4f0fb;

      background: #f7fbff;

      color: #738091;

      font-size: 12px;

      line-height: 1.5;
    }

    /* =========================
       BOTTOM TELEGRAM SPACE
    ========================== */

    .bottom-space {
      height: 96px;
    }

    @media (max-width: 380px) {

      .app {
        padding-left: 14px;
        padding-right: 14px;
      }

      .brand-title {
        font-size: 19px;
      }

      .preview-image-wrap {
        min-height: 180px;
      }

    }
  </style>
</head>

<body>

  <main class="app">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="brand">

      <div class="logo">
        <i class="fa-solid fa-images"></i>
      </div>

      <div>

        <h1 class="brand-title">
          Image Format Converter
        </h1>

        <p class="brand-subtitle">
          Fast, Simple &amp; 100% Client-Side
        </p>

      </div>

    </header>


    <!-- =========================
         FILE INPUT
    ========================== -->

    <input
      id="imageInput"
      type="file"
      accept="image/jpeg,image/png,image/webp"
      hidden
    >


    <!-- =========================
         SELECT PHOTO
    ========================== -->

    <button
      id="selectBtn"
      class="select-btn"
      type="button"
    >

      <i class="fa-solid fa-folder-open mr-2"></i>

      Select Photo

    </button>


    <!-- =========================
         EMPTY STATE
    ========================== -->

    <div
      id="emptyState"
      class="empty-state"
    >

      <i class="fa-regular fa-image"></i>

      Select an image to convert its format.

    </div>


    <!-- =========================
         CONVERTER
    ========================== -->

    <section
      id="converterSection"
      class="hidden"
    >

      <!-- PREVIEW -->

      <div class="preview-card">

        <div class="preview-image-wrap">

          <img
            id="imagePreview"
            class="preview-image"
            alt="Selected image preview"
            draggable="false"
          >

        </div>


        <div class="file-info">

          <div
            id="fileName"
            class="file-name"
          >
            image
          </div>


          <div
            id="currentFormat"
            class="format-badge"
          >
            JPEG
          </div>

        </div>

      </div>


      <!-- FORMAT PICKER -->

      <div class="section-title">
        Convert to Format:
      </div>


      <div
        id="formatGrid"
        class="format-grid"
      >

        <button
          type="button"
          class="format-btn active"
          data-format="jpg"
        >
          JPG
        </button>

        <button
          type="button"
          class="format-btn"
          data-format="png"
        >
          PNG
        </button>

        <button
          type="button"
          class="format-btn"
          data-format="webp"
        >
          WebP
        </button>

      </div>


      <!-- CONVERT -->

      <button
        id="convertBtn"
        class="convert-btn"
        type="button"
      >

        <i class="fa-solid fa-arrows-rotate mr-2"></i>

        Convert &amp; Download

      </button>


      <!-- SECURITY -->

      <div class="info-box">

        <i class="fa-solid fa-shield-halved mr-1"></i>

        Your image never leaves this device.
        Conversion happens locally inside the browser.

      </div>

    </section>


    <!-- TELEGRAM SAFE BOTTOM SPACE -->

    <div class="bottom-space"></div>

  </main>


  <script>
    (() => {

      "use strict";


      /* =====================================================
         TELEGRAM MINI APP
      ===================================================== */

      const tg =
        window.Telegram &&
        window.Telegram.WebApp;


      if (tg) {

        try {

          tg.ready();

          tg.expand();


          if (
            typeof tg.setHeaderColor ===
            "function"
          ) {

            tg.setHeaderColor(
              "#ffffff"
            );

          }


          if (
            typeof tg.setBackgroundColor ===
            "function"
          ) {

            tg.setBackgroundColor(
              "#ffffff"
            );

          }


          if (
            typeof tg.setBottomBarColor ===
            "function"
          ) {

            tg.setBottomBarColor(
              "#ffffff"
            );

          }

        } catch (error) {

          console.warn(
            "Telegram WebApp setup:",
            error
          );

        }

      }


      /* =====================================================
         DOM ELEMENTS
      ===================================================== */

      const imageInput =
        document.getElementById(
          "imageInput"
        );

      const selectBtn =
        document.getElementById(
          "selectBtn"
        );

      const emptyState =
        document.getElementById(
          "emptyState"
        );

      const converterSection =
        document.getElementById(
          "converterSection"
        );

      const imagePreview =
        document.getElementById(
          "imagePreview"
        );

      const fileName =
        document.getElementById(
          "fileName"
        );

      const currentFormat =
        document.getElementById(
          "currentFormat"
        );

      const formatGrid =
        document.getElementById(
          "formatGrid"
        );

      const convertBtn =
        document.getElementById(
          "convertBtn"
        );


      /* =====================================================
         STATE
      ===================================================== */

      let selectedFile = null;

      let selectedFormat = "jpg";

      let imageURL = null;


      /* =====================================================
         SELECT PHOTO
      ===================================================== */

      selectBtn.addEventListener(
        "click",
        () => {

          /*
           * Reset input so selecting the same image again
           * still fires the change event.
           */
          imageInput.value = "";

          imageInput.click();

        }
      );


      /* =====================================================
         IMAGE SELECTION
      ===================================================== */

      imageInput.addEventListener(
        "change",
        event => {

          const file =
            event.target.files &&
            event.target.files[0];


          if (!file) {
            return;
          }


          /*
           * Validate actual MIME type.
           */
          const supportedTypes = [
            "image/jpeg",
            "image/png",
            "image/webp"
          ];


          if (
            !supportedTypes.includes(
              file.type
            )
          ) {

            alert(
              "Please select a JPG, PNG or WebP image."
            );

            return;

          }


          selectedFile = file;


          /*
           * Release previous object URL.
           */
          if (imageURL) {

            URL.revokeObjectURL(
              imageURL
            );

          }


          imageURL =
            URL.createObjectURL(
              file
            );


          /*
           * Preview.
           */
          imagePreview.src =
            imageURL;


          /*
           * File name without extension.
           */
          const originalName =
            file.name
              .replace(
                /\.[^/.]+$/,
                ""
              );


          fileName.textContent =
            originalName ||
            "Selected image";


          /*
           * Detect original format.
           */
          currentFormat.textContent =
            getFormatName(
              file.type
            );


          /*
           * Show converter.
           */
          emptyState.classList.add(
            "hidden"
          );


          converterSection.classList.remove(
            "hidden"
          );

        }
      );


      /* =====================================================
         FORMAT NAME
      ===================================================== */

      function getFormatName(
        mimeType
      ) {

        switch (mimeType) {

          case "image/jpeg":
            return "JPEG";

          case "image/png":
            return "PNG";

          case "image/webp":
            return "WEBP";

          default:
            return "IMAGE";

        }

      }


      /* =====================================================
         FORMAT PICKER
      ===================================================== */

      formatGrid.addEventListener(
        "click",
        event => {

          const button =
            event.target.closest(
              ".format-btn"
            );


          if (!button) {
            return;
          }


          selectedFormat =
            button.dataset.format;


          formatGrid
            .querySelectorAll(
              ".format-btn"
            )
            .forEach(
              item => {

                item.classList.toggle(
                  "active",
                  item === button
                );

              }
            );

        }
      );


      /* =====================================================
         LOAD IMAGE SAFELY
      ===================================================== */

      function loadImage(
        src
      ) {

        return new Promise(
          (resolve, reject) => {

            const img =
              new Image();


            img.onload =
              () => resolve(img);


            img.onerror =
              () =>
                reject(
                  new Error(
                    "Unable to decode image."
                  )
                );


            img.src = src;

          }
        );

      }


      /* =====================================================
         CANVAS DIMENSION PROTECTION
         
         High-resolution photos can be enormous.
         We preserve aspect ratio but limit the canvas
         to a safe working dimension.
      ===================================================== */

      function calculateCanvasSize(
        width,
        height
      ) {

        const MAX_DIMENSION =
          4096;


        let outputWidth =
          width;

        let outputHeight =
          height;


        if (
          outputWidth >
            MAX_DIMENSION ||
          outputHeight >
            MAX_DIMENSION
        ) {

          const scale =
            Math.min(
              MAX_DIMENSION /
                outputWidth,

              MAX_DIMENSION /
                outputHeight
            );


          outputWidth =
            Math.max(
              1,
              Math.round(
                outputWidth * scale
              )
            );


          outputHeight =
            Math.max(
              1,
              Math.round(
                outputHeight * scale
              )
            );

        }


        return {
          width:
            outputWidth,

          height:
            outputHeight
        };

      }


      /* =====================================================
         CANVAS → BLOB
      ===================================================== */

      function canvasToBlob(
        canvas,
        mimeType,
        quality
      ) {

        return new Promise(
          (resolve, reject) => {

            try {

              canvas.toBlob(
                blob => {

                  if (!blob) {

                    reject(
                      new Error(
                        "Canvas could not create output."
                      )
                    );

                    return;

                  }


                  resolve(blob);

                },

                mimeType,

                quality

              );

            } catch (error) {

              reject(error);

            }

          }
        );

      }


      /* =====================================================
         CONVERT IMAGE
      ===================================================== */

      async function convertImage() {

        if (!selectedFile) {

          throw new Error(
            "No image selected."
          );

        }


        /*
         * Load the original image from local memory.
         */
        const img =
          await loadImage(
            imageURL
          );


        /*
         * Protect mobile devices from enormous canvas
         * allocations.
         */
        const dimensions =
          calculateCanvasSize(
            img.naturalWidth,
            img.naturalHeight
          );


        const canvas =
          document.createElement(
            "canvas"
          );


        canvas.width =
          dimensions.width;


        canvas.height =
          dimensions.height;


        const ctx =
          canvas.getContext(
            "2d",
            {
              alpha: true,
              willReadFrequently: false
            }
          );


        if (!ctx) {

          throw new Error(
            "Canvas is not supported."
          );

        }


        /*
         * High-quality image scaling.
         */
        ctx.imageSmoothingEnabled =
          true;

        ctx.imageSmoothingQuality =
          "high";


        /*
         * PNG/WebP/JPG conversion.
         *
         * JPG has no transparency, so use white
         * background rather than creating black areas.
         */
        if (
          selectedFormat ===
          "jpg"
        ) {

          ctx.fillStyle =
            "#ffffff";

          ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
          );

        }


        ctx.drawImage(
          img,

          0,
          0,

          canvas.width,
          canvas.height
        );


        let mimeType;
        let quality;
        let extension;


        switch (
          selectedFormat
        ) {

          case "png":

            mimeType =
              "image/png";

            /*
             * PNG ignores the quality parameter.
             */
            quality =
              undefined;

            extension =
              "png";

            break;


          case "webp":

            mimeType =
              "image/webp";

            quality =
              0.9;

            extension =
              "webp";

            break;


          case "jpg":

          default:

            mimeType =
              "image/jpeg";

            quality =
              0.9;

            extension =
              "jpg";

            break;

        }


        const blob =
          await canvasToBlob(
            canvas,
            mimeType,
            quality
          );


        return {
          blob,
          extension,
          mimeType
        };

      }


      /* =====================================================
         TELEGRAM / MOBILE SAFE DOWNLOAD
         
         Priority:
         
         1. Native Web Share with File
            → ideal for mobile / Telegram WebView
         
         2. <a download>
            → standard browser / desktop
         
         3. Blob URL
            → final WebView fallback
      ===================================================== */

      async function downloadResult(
        blob,
        filename
      ) {

        if (
          !blob ||
          blob.size <= 0
        ) {

          throw new Error(
            "Generated file is empty."
          );

        }


        /*
         * ---------------------------------------------------
         * METHOD 1 — MOBILE / TELEGRAM
         * ---------------------------------------------------
         */

        if (
          typeof navigator.share ===
          "function"
        ) {

          try {

            const file =
              new File(
                [blob],
                filename,
                {
                  type:
                    blob.type
                }
              );


            let shareSupported =
              true;


            if (
              typeof navigator.canShare ===
              "function"
            ) {

              shareSupported =
                navigator.canShare({
                  files: [file]
                });

            }


            if (shareSupported) {

              await navigator.share({

                files: [file],

                title:
                  "InstaPic Converted Image"

              });


              return;

            }

          } catch (error) {

            /*
             * User intentionally closed share sheet.
             */
            if (
              error &&
              error.name ===
                "AbortError"
            ) {

              return;

            }


            console.warn(
              "Native share unavailable:",
              error
            );

          }

        }


        /*
         * ---------------------------------------------------
         * METHOD 2 — NORMAL DOWNLOAD
         * ---------------------------------------------------
         */

        const objectURL =
          URL.createObjectURL(
            blob
          );


        try {

          const link =
            document.createElement(
              "a"
            );


          link.href =
            objectURL;


          link.download =
            filename;


          link.rel =
            "noopener";


          link.style.position =
            "fixed";

          link.style.left =
            "-9999px";


          document.body.appendChild(
            link
          );


          /*
           * Standard click.
           */
          link.click();


          /*
           * Some embedded WebViews respond better
           * to an explicit MouseEvent.
           */
          try {

            link.dispatchEvent(
              new MouseEvent(
                "click",
                {
                  bubbles: true,
                  cancelable: true,
                  view: window
                }
              )
            );

          } catch (_) {}


          link.remove();


          /*
           * Keep URL alive long enough for browser
           * download manager to consume it.
           */
          setTimeout(
            () => {

              URL.revokeObjectURL(
                objectURL
              );

            },
            10000
          );


          return;

        } catch (error) {

          console.warn(
            "Anchor download failed:",
            error
          );

        }


        /*
         * ---------------------------------------------------
         * METHOD 3 — WEBVIEW FALLBACK
         * ---------------------------------------------------
         */

        try {

          window.open(
            objectURL,
            "_blank"
          );


          setTimeout(
            () => {

              URL.revokeObjectURL(
                objectURL
              );

            },
            15000
          );

        } catch (error) {

          URL.revokeObjectURL(
            objectURL
          );

          throw error;

        }

      }


      /* =====================================================
         CONVERT & DOWNLOAD
      ===================================================== */

      convertBtn.addEventListener(
        "click",
        async () => {

          if (!selectedFile) {

            alert(
              "Please select a photo first."
            );

            return;

          }


          const originalHTML =
            convertBtn.innerHTML;


          convertBtn.disabled =
            true;


          convertBtn.innerHTML =
            '<span class="spinner"></span>Converting...';


          try {

            /*
             * Allow Telegram WebView to paint the
             * loading state before CPU-heavy work.
             */
            await new Promise(
              resolve =>
                requestAnimationFrame(
                  () => resolve()
                )
            );


            const result =
              await convertImage();


            const filename =
              "instapic_converted." +
              result.extension;


            await downloadResult(
              result.blob,
              filename
            );


            convertBtn.innerHTML =
              '<i class="fa-solid fa-check mr-2"></i>Done';


            /*
             * Restore button text.
             */
            setTimeout(
              () => {

                convertBtn.innerHTML =
                  originalHTML;

              },
              1800
            );


          } catch (error) {

            console.error(
              "Conversion error:",
              error
            );


            alert(
              "Conversion failed. Please try another image."
            );


            convertBtn.innerHTML =
              originalHTML;

          } finally {

            convertBtn.disabled =
              false;

          }

        }
      );


      /* =====================================================
         CLEANUP
      ===================================================== */

      window.addEventListener(
        "beforeunload",
        () => {

          if (imageURL) {

            URL.revokeObjectURL(
              imageURL
            );

            imageURL = null;

          }

        }
      );


    })();
  </script>

</body>
</html>
