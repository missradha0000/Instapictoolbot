<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#ffffff">

<title>Smart Image Compressor</title>

<!-- Telegram Mini App -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #fff;
  color: #172033;
  font-family:
    Inter,
    Roboto,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
}

button,
input {
  font-family: inherit;
}

.app {
  width: 100%;
  max-width: 620px;
  margin: auto;

  padding:
    calc(20px + env(safe-area-inset-top))
    18px
    calc(110px + env(safe-area-inset-bottom));
}

/* Header */

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 26px;
}

.logo {
  width: 46px;
  height: 46px;
  flex: 0 0 46px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 13px;

  background: #eaf4ff;
  color: #1d7edb;

  font-size: 21px;
}

.title {
  margin: 0;
  color: #1d7edb;

  font-size: 21px;
  line-height: 1.2;
  font-weight: 750;
}

.subtitle {
  margin: 4px 0 0;
  color: #8b95a3;
  font-size: 12.5px;
}

/* Select */

.select-btn {
  width: 100%;
  min-height: 55px;

  border: 0;
  border-radius: 13px;

  background: #1d7edb;
  color: #fff;

  font-size: 16px;
  font-weight: 700;

  cursor: pointer;

  box-shadow:
    0 7px 20px rgba(29,126,219,.18);

  transition: transform .12s ease;
}

.select-btn:active {
  transform: scale(.98);
}

/* Preview */

.preview-card {
  margin-top: 20px;

  overflow: hidden;

  border: 1px solid #e4e8ed;
  border-radius: 14px;

  background: #f7f9fb;
}

.preview-image {
  width: 100%;
  max-height: 390px;

  display: block;

  object-fit: contain;

  background: #f2f4f6;
}

.file-info {
  padding: 10px 12px;

  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 10px;

  font-size: 12px;
}

.file-name {
  overflow: hidden;

  text-overflow: ellipsis;
  white-space: nowrap;

  color: #566171;
}

.file-format {
  padding: 4px 8px;

  border-radius: 999px;

  background: #edf7ff;

  color: #1d7edb;

  font-weight: 700;
}

/* Controls */

.control-box {
  margin-top: 15px;

  padding: 15px;

  border: 1px solid #e5e9ee;
  border-radius: 14px;

  background: #fff;
}

.label {
  display: block;

  margin-bottom: 7px;

  color: #374151;

  font-size: 13px;
  font-weight: 700;
}

.target-input {
  width: 100%;
  height: 48px;

  padding: 0 13px;

  border: 1px solid #dce2e8;
  border-radius: 10px;

  outline: none;

  color: #172033;

  font-size: 15px;
  font-weight: 600;

  background: #fff;
}

.target-input:focus {
  border-color: #1d7edb;
  box-shadow: 0 0 0 3px rgba(29,126,219,.08);
}

/* Slider */

.slider-row {
  margin-top: 17px;
}

.slider-top {
  display: flex;
  justify-content: space-between;

  margin-bottom: 7px;
}

.quality-value {
  color: #1d7edb;
  font-weight: 750;
}

input[type="range"] {
  width: 100%;
  height: 5px;

  cursor: pointer;
}

/* Compress */

.compress-btn {
  width: 100%;
  min-height: 54px;

  margin-top: 16px;

  border: 0;
  border-radius: 12px;

  background: #10b981;
  color: #fff;

  font-size: 15px;
  font-weight: 750;

  cursor: pointer;

  box-shadow:
    0 7px 19px rgba(16,185,129,.16);

  transition:
    transform .12s ease,
    opacity .15s ease;
}

.compress-btn:active {
  transform: scale(.98);
}

.compress-btn:disabled {
  opacity: .65;
  cursor: not-allowed;
}

/* Result */

.result {
  margin-top: 20px;
}

.result-title {
  margin-bottom: 10px;

  color: #303846;

  font-size: 14px;
  font-weight: 750;
}

.result-image-box {
  overflow: hidden;

  border: 1px solid #e4e8ed;
  border-radius: 14px;

  background: #f5f7f9;
}

.result-image {
  width: 100%;
  max-height: 390px;

  display: block;

  object-fit: contain;
}

.size-box {
  margin-top: 10px;

  padding: 11px 13px;

  display: flex;
  justify-content: space-between;

  border-radius: 10px;

  background: #f1fbf7;

  color: #147a59;

  font-size: 13px;
  font-weight: 700;
}

.download-grid {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 9px;

  margin-top: 11px;
}

.download-btn {
  min-height: 49px;

  border: 0;
  border-radius: 11px;

  background: #1d7edb;
  color: #fff;

  font-size: 13px;
  font-weight: 700;

  cursor: pointer;
}

.download-btn.jpg {
  background: #10b981;
}

.download-btn:active {
  transform: scale(.98);
}

/* Loading */

.spinner {
  display: inline-block;

  width: 18px;
  height: 18px;

  margin-right: 7px;

  vertical-align: -4px;

  border:
    2px solid
    rgba(255,255,255,.4);

  border-top-color: #fff;

  border-radius: 50%;

  animation: spin .7s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.hidden {
  display: none !important;
}

.bottom-space {
  height: 96px;
}

@media(max-width:380px) {
  .app {
    padding-left: 14px;
    padding-right: 14px;
  }

  .download-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>


<body>

<main class="app">

  <!-- HEADER -->

  <header class="brand">

    <div class="logo">
      🗜️
    </div>

    <div>
      <h1 class="title">
        Smart Image Compressor
      </h1>

      <p class="subtitle">
        Serverless, Ultra-fast &amp; 100% Secure
      </p>
    </div>

  </header>


  <!-- FILE INPUT -->

  <input
    id="imageInput"
    type="file"
    accept="image/jpeg,image/png,image/webp"
    hidden
  >


  <!-- SELECT -->

  <button
    id="selectBtn"
    class="select-btn"
    type="button"
  >
    📁 Select Photo
  </button>


  <!-- IMAGE -->

  <section
    id="imageSection"
    class="hidden"
  >

    <div class="preview-card">

      <img
        id="originalPreview"
        class="preview-image"
        alt="Original image"
      >

      <div class="file-info">

        <span
          id="fileName"
          class="file-name"
        >
          Image
        </span>

        <span
          id="fileFormat"
          class="file-format"
        >
          JPG
        </span>

      </div>

    </div>


    <!-- SETTINGS -->

    <div class="control-box">

      <label
        class="label"
        for="targetSize"
      >
        Target Size (KB)
      </label>

      <input
        id="targetSize"
        class="target-input"
        type="number"
        min="1"
        step="1"
        placeholder="Example: 200"
        inputmode="numeric"
      >


      <div class="slider-row">

        <div class="slider-top">

          <span class="label" style="margin:0">
            Quality
          </span>

          <span
            id="qualityVal"
            class="quality-value"
          >
            80%
          </span>

        </div>

        <input
          id="qualitySlider"
          type="range"
          min="1"
          max="100"
          value="80"
        >

      </div>

    </div>


    <!-- COMPRESS -->

    <button
      id="compressBtn"
      class="compress-btn"
      type="button"
    >
      Compress Image
    </button>


    <!-- RESULT -->

    <section
      id="result"
      class="result hidden"
    >

      <div class="result-title">
        Compressed Result
      </div>

      <div class="result-image-box">

        <img
          id="compressedPreview"
          class="result-image"
          alt="Compressed image"
        >

      </div>

      <div class="size-box">

        <span>
          Compressed Size
        </span>

        <span id="compressedSize">
          0 KB
        </span>

      </div>


      <div class="download-grid">

        <button
          id="downloadPng"
          class="download-btn"
          type="button"
        >
          Download as PNG
        </button>

        <button
          id="downloadJpg"
          class="download-btn jpg"
          type="button"
        >
          Download as JPG
        </button>

      </div>

    </section>

  </section>


  <div class="bottom-space"></div>

</main>


<script>
(() => {

"use strict";


/* ============================================================
   TELEGRAM INITIALIZATION
============================================================ */

const tg =
  window.Telegram &&
  window.Telegram.WebApp;

if (tg) {

  try {

    tg.ready();
    tg.expand();

    if (typeof tg.setHeaderColor === "function") {
      tg.setHeaderColor("#ffffff");
    }

    if (typeof tg.setBackgroundColor === "function") {
      tg.setBackgroundColor("#ffffff");
    }

    if (typeof tg.setBottomBarColor === "function") {
      tg.setBottomBarColor("#ffffff");
    }

  } catch (e) {
    console.warn("Telegram:", e);
  }

}


/* ============================================================
   DOM
============================================================ */

const imageInput =
  document.getElementById("imageInput");

const selectBtn =
  document.getElementById("selectBtn");

const imageSection =
  document.getElementById("imageSection");

const originalPreview =
  document.getElementById("originalPreview");

const fileName =
  document.getElementById("fileName");

const fileFormat =
  document.getElementById("fileFormat");

const targetSize =
  document.getElementById("targetSize");

const qualitySlider =
  document.getElementById("qualitySlider");

const qualityVal =
  document.getElementById("qualityVal");

const compressBtn =
  document.getElementById("compressBtn");

const result =
  document.getElementById("result");

const compressedPreview =
  document.getElementById("compressedPreview");

const compressedSize =
  document.getElementById("compressedSize");

const downloadJpg =
  document.getElementById("downloadJpg");

const downloadPng =
  document.getElementById("downloadPng");


/* ============================================================
   STATE
============================================================ */

let selectedFile = null;

let originalImage = null;

let compressedBlob = null;

let compressedURL = null;

let originalURL = null;


/*
 * Maximum working dimension.
 *
 * This protects mobile/Telegram WebViews from extremely
 * large camera images.
 */
const MAX_DIMENSION = 1600;


/*
 * Binary search iterations.
 *
 * 15 iterations gives extremely fine quality convergence.
 */
const QUALITY_ITERATIONS = 15;


/*
 * Target accuracy.
 *
 * We attempt to get as close as possible to target from below.
 */
const TARGET_ACCURACY = 0.995;


/* ============================================================
   QUALITY DISPLAY
============================================================ */

qualitySlider.addEventListener(
  "input",
  () => {

    qualityVal.textContent =
      qualitySlider.value + "%";

  }
);


/* ============================================================
   SELECT
============================================================ */

selectBtn.addEventListener(
  "click",
  () => {

    imageInput.value = "";

    imageInput.click();

  }
);


/* ============================================================
   FILE SELECTED
============================================================ */

imageInput.addEventListener(
  "change",
  async event => {

    const file =
      event.target.files &&
      event.target.files[0];

    if (!file) {
      return;
    }


    if (
      ![
        "image/jpeg",
        "image/png",
        "image/webp"
      ].includes(file.type)
    ) {

      alert(
        "Please select a JPG, PNG or WebP image."
      );

      return;

    }


    selectedFile = file;


    /*
     * Release previous URL.
     */
    if (originalURL) {
      URL.revokeObjectURL(
        originalURL
      );
    }


    originalURL =
      URL.createObjectURL(
        file
      );


    originalPreview.src =
      originalURL;


    fileName.textContent =
      file.name;


    fileFormat.textContent =
      getFormat(file.type);


    imageSection.classList.remove(
      "hidden"
    );


    result.classList.add(
      "hidden"
    );


    compressedBlob = null;


    if (compressedURL) {

      URL.revokeObjectURL(
        compressedURL
      );

      compressedURL = null;

    }


    /*
     * Decode original image.
     */
    try {

      originalImage =
        await loadImage(
          file
        );

    } catch (error) {

      alert(
        "Unable to read this image."
      );

      console.error(error);

    }

  }
);


/* ============================================================
   FORMAT
============================================================ */

function getFormat(type) {

  if (type === "image/png") {
    return "PNG";
  }

  if (type === "image/webp") {
    return "WEBP";
  }

  return "JPG";

}


/* ============================================================
   LOAD IMAGE
============================================================ */

function loadImage(file) {

  return new Promise(
    (resolve, reject) => {

      const url =
        URL.createObjectURL(
          file
        );

      const img =
        new Image();

      img.onload =
        () => {

          URL.revokeObjectURL(
            url
          );

          resolve(img);

        };

      img.onerror =
        () => {

          URL.revokeObjectURL(
            url
          );

          reject(
            new Error(
              "Image decoding failed."
            )
          );

        };

      img.src =
        url;

    }
  );

}


/* ============================================================
   SAFE DIMENSIONS
============================================================ */

function getSafeDimensions(
  width,
  height
) {

  let w = width;
  let h = height;


  if (
    w > MAX_DIMENSION ||
    h > MAX_DIMENSION
  ) {

    const scale =
      Math.min(
        MAX_DIMENSION / w,
        MAX_DIMENSION / h
      );


    w =
      Math.max(
        1,
        Math.round(w * scale)
      );


    h =
      Math.max(
        1,
        Math.round(h * scale)
      );

  }


  return {
    width: w,
    height: h
  };

}


/* ============================================================
   CANVAS CREATION
============================================================ */

function createCanvas(
  img,
  scale = 1
) {

  const dimensions =
    getSafeDimensions(
      img.naturalWidth,
      img.naturalHeight
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    Math.max(
      1,
      Math.round(
        dimensions.width *
        scale
      )
    );


  canvas.height =
    Math.max(
      1,
      Math.round(
        dimensions.height *
        scale
      )
    );


  const ctx =
    canvas.getContext(
      "2d",
      {
        alpha: false
      }
    );


  if (!ctx) {
    throw new Error(
      "Canvas is not supported."
    );
  }


  /*
   * White background.
   *
   * Important when converting PNG with transparency
   * into JPG.
   */
  ctx.fillStyle =
    "#ffffff";


  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.imageSmoothingEnabled =
    true;

  ctx.imageSmoothingQuality =
    "high";


  ctx.drawImage(
    img,
    0,
    0,
    canvas.width,
    canvas.height
  );


  return canvas;

}


/* ============================================================
   CANVAS → BLOB
============================================================ */

function canvasToBlob(
  canvas,
  type,
  quality
) {

  return new Promise(
    resolve => {

      canvas.toBlob(
        blob => {
          resolve(blob);
        },
        type,
        quality
      );

    }
  );

}


/* ============================================================
   QUALITY → BLOB
============================================================ */

async function encodeAtQuality(
  canvas,
  quality
) {

  return await canvasToBlob(
    canvas,
    "image/jpeg",
    quality
  );

}


/* ============================================================
   FIND BEST QUALITY UNDER TARGET
============================================================

   IMPORTANT:

   We don't simply calculate:

       target / original

   because JPEG file size is NOT linear with quality.

   Instead we actually encode the image repeatedly.

   Example:

       target = 200 KB

   The algorithm tests:

       0.505
       0.7525
       0.87625
       ...

   for 15 iterations.

   It remembers the largest result that is still:

       <= 200 KB

   Therefore we maximize the delivered file size without
   crossing the target.
============================================================ */

async function findBestQuality(
  canvas,
  targetBytes
) {

  let low =
    0.01;

  let high =
    1.0;


  let bestBlob =
    null;

  let bestQuality =
    0.01;


  /*
   * First determine whether even minimum quality
   * is larger than the requested target.
   */
  const minimumBlob =
    await encodeAtQuality(
      canvas,
      0.01
    );


  if (
    minimumBlob &&
    minimumBlob.size >
    targetBytes
  ) {

    /*
     * Target is physically impossible at this
     * resolution.

     * We return minimum quality here.
     */
    return {
      blob:
        minimumBlob,

      quality:
        0.01,

      exact:
        false,

      impossible:
        true
    };

  }


  /*
   * Check whether maximum quality is already under
   * the target.
   */
  const maximumBlob =
    await encodeAtQuality(
      canvas,
      1.0
    );


  if (
    maximumBlob &&
    maximumBlob.size <=
    targetBytes
  ) {

    /*
     * Great — we can deliver maximum quality and still
     * remain under target.
     */
    return {
      blob:
        maximumBlob,

      quality:
        1.0,

      exact:
        true,

      impossible:
        false
    };

  }


  /*
   * Main binary search.
   */
  for (
    let i = 0;
    i < QUALITY_ITERATIONS;
    i++
  ) {

    const mid =
      (low + high) / 2;


    const blob =
      await encodeAtQuality(
        canvas,
        mid
      );


    if (!blob) {
      break;
    }


    if (
      blob.size <=
      targetBytes
    ) {

      /*
       * Valid candidate.
       *
       * Save it because we want the LARGEST possible
       * file below the target.
       */
      bestBlob =
        blob;


      bestQuality =
        mid;


      /*
       * We can try even higher quality.
       */
      low =
        mid;

    } else {

      /*
       * Too large.
       *
       * Reduce quality.
       */
      high =
        mid;

    }


    /*
     * If we're already within 0.5% of target,
     * further searching gives little practical benefit.
     */
    if (
      bestBlob &&
      bestBlob.size >=
      targetBytes *
      TARGET_ACCURACY
    ) {

      /*
       * Do not immediately stop all iterations.
       *
       * We still perform the requested high-precision
       * binary search, but the remaining iterations will
       * quickly converge.
       */

    }

  }


  /*
   * If binary search somehow didn't produce a candidate,
   * use minimum quality.
   */
  if (!bestBlob) {

    bestBlob =
      minimumBlob;

    bestQuality =
      0.01;

  }


  return {
    blob:
      bestBlob,

    quality:
      bestQuality,

    exact:
      bestBlob.size <= targetBytes,

    impossible:
      false
  };

}


/* ============================================================
   DIMENSION OPTIMIZATION
============================================================

   JPEG quality is not the only factor affecting size.

   If quality=1 still gives a result significantly below
   target, there is unused size capacity.

   We therefore optionally increase the image resolution
   until we get closer to target.

   Example:

       Target = 200 KB
       quality-search result = 142 KB

   We increase working dimensions and run the quality search
   again.

   This is what makes the result substantially closer to
   the requested target instead of stopping at a tiny file.
============================================================ */

async function compressToTarget(
  img,
  targetBytes
) {

  const base =
    getSafeDimensions(
      img.naturalWidth,
      img.naturalHeight
    );


  let scale =
    1;


  let bestOverall =
    null;


  /*
   * Up to several resolution passes.
   *
   * We deliberately keep this small for mobile performance.
   */
  for (
    let pass = 0;
    pass < 5;
    pass++
  ) {

    const canvas =
      createCanvas(
        img,
        scale
      );


    /*
     * Make sure the canvas dimensions do not exceed
     * our safety limit.
     */
    const workingWidth =
      canvas.width;


    const workingHeight =
      canvas.height;


    const qualityResult =
      await findBestQuality(
        canvas,
        targetBytes
      );


    const blob =
      qualityResult.blob;


    if (!blob) {
      break;
    }


    /*
     * Save the best result under target.
     */
    if (
      blob.size <= targetBytes
    ) {

      if (
        !bestOverall ||
        blob.size >
        bestOverall.blob.size
      ) {

        bestOverall = {
          blob:
            blob,

          quality:
            qualityResult.quality,

          width:
            workingWidth,

          height:
            workingHeight
        };

      }

    }


    /*
     * If we're already very close to target,
     * stop resolution expansion.
     */
    if (
      blob.size >=
      targetBytes *
      TARGET_ACCURACY
    ) {

      break;

    }


    /*
     * If minimum quality was already too large,
     * resolution is too high.
     *
     * Reduce scale.
     */
    if (
      qualityResult.impossible
    ) {

      scale *=
        0.90;

      continue;

    }


    /*
     * If maximum quality is below target, increase
     * dimensions to consume more available bytes.
     */
    if (
      qualityResult.quality >=
      0.999
    ) {

      const ratio =
        Math.sqrt(
          targetBytes /
          blob.size
        );


      /*
       * Limit how aggressively resolution changes.
       */
      const adjustedRatio =
        Math.min(
          1.30,
          Math.max(
            1.04,
            ratio
          )
        );


      scale *=
        adjustedRatio;


      /*
       * Never exceed original image resolution.
       */
      const maximumScale =
        1;


      scale =
        Math.min(
          scale,
          maximumScale
        );


      /*
       * If we're already at original resolution,
       * there is nothing else to increase.
       */
      if (
        scale >=
        maximumScale
      ) {

        break;

      }

    } else {

      /*
       * Quality is already below 1, therefore we can
       * continue with current resolution.
       */
      break;

    }


    /*
     * Browser breathing room.
     */
    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          0
        )
    );

  }


  /*
   * Fallback.
   */
  if (!bestOverall) {

    const canvas =
      createCanvas(
        img,
        1
      );


    const fallback =
      await encodeAtQuality(
        canvas,
        0.01
      );


    bestOverall = {

      blob:
        fallback,

      quality:
        0.01,

      width:
        canvas.width,

      height:
        canvas.height

    };

  }


  return bestOverall;

}


/* ============================================================
   MANUAL SLIDER COMPRESSION
============================================================ */

async function compressManual(
  img,
  percentage
) {

  const quality =
    Math.max(
      0.01,
      Math.min(
        1,
        percentage / 100
      )
    );


  const canvas =
    createCanvas(
      img,
      1
    );


  const blob =
    await encodeAtQuality(
      canvas,
      quality
    );


  return {
    blob,
    quality,
    width:
      canvas.width,
    height:
      canvas.height
  };

}


/* ============================================================
   COMPRESS BUTTON
============================================================ */

compressBtn.addEventListener(
  "click",
  async () => {

    if (
      !selectedFile ||
      !originalImage
    ) {

      alert(
        "Please select an image first."
      );

      return;

    }


    const originalText =
      compressBtn.innerHTML;


    compressBtn.disabled =
      true;


    compressBtn.innerHTML =
      '<span class="spinner"></span>Compressing...';


    result.classList.add(
      "hidden"
    );


    try {

      /*
       * Read target.
       */
      const targetValue =
        parseFloat(
          targetSize.value
        );


      /*
       * ======================================================
       * TARGET SIZE MODE
       * ======================================================
       *
       * Empty target field:
       *       use slider.
       *
       * Target field filled:
       *       use precision target-size algorithm.
       */
      if (
        Number.isFinite(
          targetValue
        ) &&
        targetValue > 0
      ) {

        const targetBytes =
          Math.floor(
            targetValue *
            1024
          );


        const resultData =
          await compressToTarget(
            originalImage,
            targetBytes
          );


        compressedBlob =
          resultData.blob;

      } else {

        /*
         * Slider mode.
         */
        const sliderValue =
          parseInt(
            qualitySlider.value,
            10
          );


        const resultData =
          await compressManual(
            originalImage,
            sliderValue
          );


        compressedBlob =
          resultData.blob;

      }


      if (
        !compressedBlob ||
        compressedBlob.size <= 0
      ) {

        throw new Error(
          "Compression produced an empty file."
        );

      }


      /*
       * Release previous result URL.
       */
      if (compressedURL) {

        URL.revokeObjectURL(
          compressedURL
        );

      }


      compressedURL =
        URL.createObjectURL(
          compressedBlob
        );


      compressedPreview.src =
        compressedURL;


      const sizeKB =
        compressedBlob.size /
        1024;


      compressedSize.textContent =
        formatKB(
          sizeKB
        );


      result.classList.remove(
        "hidden"
      );


      /*
       * Scroll result into view on mobile/Telegram.
       */
      setTimeout(
        () => {

          result.scrollIntoView({
            behavior: "smooth",
            block: "nearest"
          });

        },
        100
      );


    } catch (error) {

      console.error(
        "Compression error:",
        error
      );


      alert(
        "Compression failed. Please try another image."
      );


    } finally {

      compressBtn.disabled =
        false;


      compressBtn.innerHTML =
        originalText;

    }

  }
);


/* ============================================================
   SIZE FORMAT
============================================================ */

function formatKB(
  kb
) {

  if (kb < 1) {

    return (
      Math.max(
        0.01,
        kb
      ).toFixed(2) +
      " KB"
    );

  }


  if (kb < 10) {

    return (
      kb.toFixed(2) +
      " KB"
    );

  }


  return (
    kb.toFixed(1) +
    " KB"
  );

}


/* ============================================================
   TELEGRAM / MOBILE DOWNLOAD
============================================================

   Strategy:

   1. Try native Web Share with File.
   2. Try normal <a download>.
   3. Open Blob URL as fallback.

   This is much more reliable than relying on one
   desktop-only download technique.
============================================================ */

async function downloadBlob(
  blob,
  filename,
  mime
) {

  if (!blob) {

    throw new Error(
      "No file available."
    );

  }


  /*
   * ========================================================
   * NATIVE SHARE
   * ========================================================
   *
   * Especially useful on Android/WebView.
   */
  if (
    typeof navigator.share ===
    "function"
  ) {

    try {

      const file =
        new File(
          [blob],
          filename,
          {
            type: mime
          }
        );


      let supported =
        true;


      if (
        typeof navigator.canShare ===
        "function"
      ) {

        supported =
          navigator.canShare({
            files: [file]
          });

      }


      if (supported) {

        await navigator.share({
          files: [file],
          title:
            "InstaPic Image"
        });


        return true;

      }

    } catch (error) {

      /*
       * User cancellation isn't an error that should
       * interrupt the application.
       */
      if (
        error &&
        error.name ===
        "AbortError"
      ) {

        return true;

      }

      console.warn(
        "Native share unavailable:",
        error
      );

    }

  }


  /*
   * ========================================================
   * NORMAL DOWNLOAD
   * ========================================================
   */

  const url =
    URL.createObjectURL(
      blob
    );


  try {

    const link =
      document.createElement(
        "a"
      );


    link.href =
      url;


    link.download =
      filename;


    link.rel =
      "noopener";


    link.style.position =
      "fixed";

    link.style.left =
      "-9999px";

    link.style.top =
      "0";


    document.body.appendChild(
      link
    );


    link.click();


    /*
     * Additional synthetic event for some WebViews.
     */
    try {

      link.dispatchEvent(
        new MouseEvent(
          "click",
          {
            bubbles: true,
            cancelable: true,
            view: window
          }
        )
      );

    } catch (_) {}


    link.remove();


    /*
     * Keep Blob alive for mobile browsers.
     */
    setTimeout(
      () => {

        URL.revokeObjectURL(
          url
        );

      },
      20000
    );


    return true;

  } catch (error) {

    console.warn(
      "Download fallback:",
      error
    );

  }


  /*
   * ========================================================
   * WEBVIEW FALLBACK
   * ========================================================
   */

  try {

    window.open(
      url,
      "_blank"
    );


    setTimeout(
      () => {

        URL.revokeObjectURL(
          url
        );

      },
      30000
    );


    return true;

  } catch (error) {

    URL.revokeObjectURL(
      url
    );

    throw error;

  }

}


/* ============================================================
   DOWNLOAD JPG
============================================================ */

downloadJpg.addEventListener(
  "click",
  async () => {

    if (!compressedBlob) {

      alert(
        "Compress the image first."
      );

      return;

    }


    const originalText =
      downloadJpg.innerHTML;


    downloadJpg.disabled =
      true;


    downloadJpg.innerHTML =
      "Preparing...";


    try {

      await downloadBlob(
        compressedBlob,
        "instapic_compressed.jpg",
        "image/jpeg"
      );

    } catch (error) {

      console.error(error);

      alert(
        "Download could not be started."
      );

    } finally {

      downloadJpg.disabled =
        false;

      downloadJpg.innerHTML =
        originalText;

    }

  }
);


/* ============================================================
   DOWNLOAD PNG
============================================================

   The compressed result is JPEG internally.

   For PNG download we render the compressed JPEG into
   a canvas and export PNG.

   NOTE:
   PNG is lossless and therefore can be substantially larger
   than JPG. This is normal PNG behavior.
============================================================ */

downloadPng.addEventListener(
  "click",
  async () => {

    if (!compressedBlob) {

      alert(
        "Compress the image first."
      );

      return;

    }


    const originalText =
      downloadPng.innerHTML;


    downloadPng.disabled =
      true;


    downloadPng.innerHTML =
      "Preparing...";


    try {

      const img =
        await loadImage(
          compressedBlob
        );


      const canvas =
        createCanvas(
          img,
          1
        );


      const pngBlob =
        await canvasToBlob(
          canvas,
          "image/png"
        );


      if (!pngBlob) {

        throw new Error(
          "PNG conversion failed."
        );

      }


      await downloadBlob(
        pngBlob,
        "instapic_compressed.png",
        "image/png"
      );


    } catch (error) {

      console.error(error);

      alert(
        "PNG download could not be started."
      );

    } finally {

      downloadPng.disabled =
        false;

      downloadPng.innerHTML =
        originalText;

    }

  }
);


/* ============================================================
   CLEANUP
============================================================ */

window.addEventListener(
  "beforeunload",
  () => {

    if (originalURL) {

      URL.revokeObjectURL(
        originalURL
      );

    }


    if (compressedURL) {

      URL.revokeObjectURL(
        compressedURL
      );

    }

  }
);

})();
