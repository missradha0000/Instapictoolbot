<script>
/* ============================================================
   SMART IMAGE COMPRESSOR — PRECISION COMPRESSION ENGINE
   Client-side only
   ============================================================ */

(() => {
  "use strict";

  /* ------------------------------------------------------------
     DOM
     ------------------------------------------------------------ */

  const imageInput = document.getElementById("imageInput");
  const targetSize = document.getElementById("targetSize");
  const qualitySlider = document.getElementById("qualitySlider");
  const qualityVal = document.getElementById("qualityVal");
  const compressBtn = document.getElementById("compressBtn");

  const compressedPreview =
    document.getElementById("compressedPreview");

  const compressedSize =
    document.getElementById("compressedSize");

  const downloadJpg =
    document.getElementById("downloadJpg");

  const downloadPng =
    document.getElementById("downloadPng");


  /* ------------------------------------------------------------
     CONFIGURATION
     ------------------------------------------------------------ */

  const MAX_DIMENSION = 1600;

  // Required minimum binary-search iterations.
  const BINARY_ITERATIONS = 15;

  // JPEG quality limits.
  const MIN_QUALITY = 0.01;
  const MAX_QUALITY = 1.00;

  // Smallest scale we are willing to use if necessary.
  const MIN_SCALE = 0.10;

  // Target tolerance used only as a practical stopping condition.
  // The search still performs all 15 iterations.
  const SIZE_TOLERANCE_BYTES = 100;


  /* ------------------------------------------------------------
     STATE
     ------------------------------------------------------------ */

  let selectedImage = null;
  let selectedFile = null;
  let compressedBlob = null;
  let compressedObjectURL = null;


  /* ------------------------------------------------------------
     TELEGRAM WEB APP
     ------------------------------------------------------------ */

  if (window.Telegram && window.Telegram.WebApp) {
    try {
      const tg = window.Telegram.WebApp;

      tg.ready();
      tg.expand();

      if (tg.setHeaderColor) {
        tg.setHeaderColor("#ffffff");
      }

      if (tg.setBackgroundColor) {
        tg.setBackgroundColor("#ffffff");
      }

      if (tg.setBottomBarColor) {
        tg.setBottomBarColor("#ffffff");
      }
    } catch (error) {
      console.warn("Telegram WebApp setup failed:", error);
    }
  }


  /* ------------------------------------------------------------
     UTILITY FUNCTIONS
     ------------------------------------------------------------ */

  function formatBytes(bytes) {
    if (!bytes || bytes <= 0) {
      return "0 KB";
    }

    const kb = bytes / 1024;

    if (kb < 1024) {
      return kb.toFixed(kb < 10 ? 2 : 1) + " KB";
    }

    return (kb / 1024).toFixed(2) + " MB";
  }


  function clamp(value, min, max) {
    return Math.min(
      Math.max(value, min),
      max
    );
  }


  /*
   * Yield to the browser between expensive canvas operations.
   * This prevents the Telegram WebView from becoming completely
   * unresponsive on larger images.
   */
  function nextFrame() {
    return new Promise(resolve => {
      requestAnimationFrame(resolve);
    });
  }


  /* ------------------------------------------------------------
     QUALITY SLIDER
     ------------------------------------------------------------ */

  if (qualitySlider && qualityVal) {

    qualitySlider.addEventListener("input", () => {

      const value =
        Number(qualitySlider.value);

      qualityVal.textContent =
        Math.round(value) + "%";
    });

    // Initial value
    qualityVal.textContent =
      Math.round(
        Number(qualitySlider.value) || 80
      ) + "%";
  }


  /* ------------------------------------------------------------
     LOAD IMAGE
     ------------------------------------------------------------ */

  function loadImageFromFile(file) {

    return new Promise((resolve, reject) => {

      const objectURL =
        URL.createObjectURL(file);

      const img =
        new Image();

      img.onload = () => {

        URL.revokeObjectURL(objectURL);

        resolve(img);
      };

      img.onerror = () => {

        URL.revokeObjectURL(objectURL);

        reject(
          new Error("Unable to decode image.")
        );
      };

      img.src = objectURL;
    });
  }


  /* ------------------------------------------------------------
     CALCULATE SAFE DIMENSIONS
     ------------------------------------------------------------ */

  function calculateDimensions(
    img,
    scale = 1
  ) {

    let width =
      img.naturalWidth * scale;

    let height =
      img.naturalHeight * scale;

    /*
     * Hard cap at 1600px as requested.
     */
    const largestDimension =
      Math.max(width, height);

    if (largestDimension > MAX_DIMENSION) {

      const factor =
        MAX_DIMENSION /
        largestDimension;

      width *= factor;
      height *= factor;
    }

    width =
      Math.max(
        1,
        Math.round(width)
      );

    height =
      Math.max(
        1,
        Math.round(height)
      );

    return {
      width,
      height
    };
  }


  /* ------------------------------------------------------------
     CREATE CANVAS
     ------------------------------------------------------------ */

  function createCanvas(
    img,
    scale
  ) {

    const {
      width,
      height
    } =
      calculateDimensions(
        img,
        scale
      );

    const canvas =
      document.createElement("canvas");

    canvas.width = width;
    canvas.height = height;

    const ctx =
      canvas.getContext(
        "2d",
        {
          alpha: false
        }
      );

    if (!ctx) {
      throw new Error(
        "Canvas is not supported by this browser."
      );
    }

    /*
     * White background.
     *
     * This is important when converting transparent PNG/WEBP
     * images to JPEG.
     */
    ctx.fillStyle = "#ffffff";

    ctx.fillRect(
      0,
      0,
      width,
      height
    );

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";

    ctx.drawImage(
      img,
      0,
      0,
      width,
      height
    );

    return canvas;
  }


  /* ------------------------------------------------------------
     CANVAS → JPEG BLOB
     ------------------------------------------------------------ */

  function canvasToJPEG(
    canvas,
    quality
  ) {

    return new Promise((resolve, reject) => {

      canvas.toBlob(
        blob => {

          if (!blob) {
            reject(
              new Error(
                "Canvas failed to generate JPEG."
              )
            );

            return;
          }

          resolve(blob);
        },

        "image/jpeg",

        clamp(
          quality,
          MIN_QUALITY,
          MAX_QUALITY
        )
      );

    });
  }


  /* ------------------------------------------------------------
     COMPRESS AT SPECIFIC QUALITY
     ------------------------------------------------------------ */

  async function encodeAtQuality(
    img,
    quality,
    scale
  ) {

    const canvas =
      createCanvas(
        img,
        scale
      );

    const blob =
      await canvasToJPEG(
        canvas,
        quality
      );

    return {
      blob,
      canvas,
      quality,
      scale
    };
  }


  /* ============================================================
     PRECISION BINARY SEARCH
     ============================================================

     Goal:

       blob.size <= targetBytes

     Find the highest possible JPEG quality satisfying that
     condition.

     Because JPEG quality is normally monotonic enough for
     Canvas implementations, binary search converges quickly.

     IMPORTANT:
     We preserve the BEST VALID RESULT instead of returning the
     final midpoint. This prevents the common problem where the
     final estimate is unnecessarily smaller than the target.
     ============================================================ */

  async function precisionBinarySearch(
    img,
    targetBytes,
    scale,
    startingQuality
  ) {

    let low =
      MIN_QUALITY;

    let high =
      MAX_QUALITY;

    /*
     * Best valid result found so far.
     *
     * "Best" means:
     * - size <= target
     * - largest file size possible
     * - therefore highest practical quality
     */
    let bestValid = null;

    /*
     * Test the manually selected quality first.
     *
     * This allows the slider to influence the result when
     * appropriate while the binary search still finds the
     * maximum possible quality under the target.
     */
    if (
      Number.isFinite(startingQuality) &&
      startingQuality >= MIN_QUALITY &&
      startingQuality <= MAX_QUALITY
    ) {

      await nextFrame();

      const initial =
        await encodeAtQuality(
          img,
          startingQuality,
          scale
        );

      if (
        initial.blob.size <= targetBytes
      ) {

        bestValid = initial;

        low =
          startingQuality;

      } else {

        high =
          startingQuality;
      }
    }


    /*
     * EXACTLY 15 binary-search iterations.
     */
    for (
      let iteration = 0;
      iteration < BINARY_ITERATIONS;
      iteration++
    ) {

      const mid =
        (low + high) / 2;

      await nextFrame();

      const result =
        await encodeAtQuality(
          img,
          mid,
          scale
        );

      const size =
        result.blob.size;


      /*
       * VALID:
       *
       * File is below or equal to target.
       *
       * Therefore we can safely increase quality.
       */
      if (size <= targetBytes) {

        /*
         * Keep the largest valid file.
         *
         * This is the key fix for the "200 KB → 171 KB"
         * problem.
         */
        if (
          !bestValid ||
          size > bestValid.blob.size
        ) {

          bestValid =
            result;
        }

        low =
          mid;
      }


      /*
       * INVALID:
       *
       * File exceeds target.
       *
       * Decrease quality.
       */
      else {

        high =
          mid;
      }


      /*
       * We still continue the required iterations.
       *
       * This only provides a useful early mathematical
       * indication; it does NOT break the 15-iteration loop.
       */
    }

    return bestValid;
  }


  /* ============================================================
     FIND A RESULT THAT FITS THE TARGET
     ============================================================ */

  async function findTargetSize(
    img,
    targetBytes,
    manualQuality
  ) {

    /*
     * Start at full resolution, capped to 1600px.
     */
    let scale = 1;

    /*
     * We may need to reduce dimensions if even quality 0.01
     * produces a file larger than the target.
     */
    for (
      let dimensionAttempt = 0;
      dimensionAttempt < 12;
      dimensionAttempt++
    ) {

      await nextFrame();


      /*
       * First check the absolute minimum quality.
       *
       * If this is already within target, binary search can
       * operate normally.
       */
      const minimum =
        await encodeAtQuality(
          img,
          MIN_QUALITY,
          scale
        );


      /*
       * Minimum quality already fits.
       */
      if (
        minimum.blob.size <= targetBytes
      ) {

        const result =
          await precisionBinarySearch(
            img,
            targetBytes,
            scale,
            manualQuality
          );

        if (result) {
          return result;
        }

        /*
         * Safety fallback.
         */
        return minimum;
      }


      /*
       * Even quality 0.01 is too large.
       *
       * Therefore quality alone cannot solve the requested
       * target size. We must reduce dimensions.
       *
       * Reduce by 10% each pass.
       */
      scale *= 0.90;

      scale =
        Math.max(
          scale,
          MIN_SCALE
        );
    }


    /*
     * Last-resort compression at minimum quality.
     */
    return await encodeAtQuality(
      img,
      MIN_QUALITY,
      scale
    );
  }


  /* ------------------------------------------------------------
     SELECT IMAGE
     ------------------------------------------------------------ */

  if (imageInput) {

    imageInput.addEventListener(
      "change",
      async event => {

        const file =
          event.target.files &&
          event.target.files[0];

        if (!file) {
          return;
        }

        if (
          !file.type.startsWith("image/")
        ) {
          alert(
            "Please select a valid image."
          );

          imageInput.value = "";

          return;
        }

        try {

          selectedFile =
            file;

          selectedImage =
            await loadImageFromFile(
              file
            );

          /*
           * Optional original preview if the HTML contains
           * an element with id="originalPreview".
           */
          const originalPreview =
            document.getElementById(
              "originalPreview"
            );

          if (originalPreview) {

            originalPreview.src =
              URL.createObjectURL(
                file
              );
          }

          /*
           * Clear previous result.
           */
          compressedBlob = null;

          if (compressedObjectURL) {

            URL.revokeObjectURL(
              compressedObjectURL
            );

            compressedObjectURL =
              null;
          }

          if (compressedPreview) {
            compressedPreview.removeAttribute(
              "src"
            );
          }

          if (compressedSize) {
            compressedSize.textContent = "";
          }

        } catch (error) {

          console.error(error);

          alert(
            "Unable to load this image."
          );

          selectedFile = null;
          selectedImage = null;
        }
      }
    );
  }


  /* ============================================================
     MAIN COMPRESS BUTTON
     ============================================================ */

  if (compressBtn) {

    compressBtn.addEventListener(
      "click",
      async () => {

        if (!selectedImage) {

          alert(
            "Please select an image first."
          );

          return;
        }


        /*
         * --------------------------------------------------------
         * TARGET SIZE DETECTION
         * --------------------------------------------------------
         *
         * If targetSize is empty:
         * use the manual quality slider.
         *
         * If targetSize has a value:
         * target-size binary search takes priority.
         */

        const rawTarget =
          targetSize
            ? String(targetSize.value).trim()
            : "";


        let targetKB =
          Number(rawTarget);


        const sliderValue =
          Number(
            qualitySlider
              ? qualitySlider.value
              : 80
          );


        const manualQuality =
          clamp(
            sliderValue / 100,
            MIN_QUALITY,
            MAX_QUALITY
          );


        /*
         * --------------------------------------------------------
         * MANUAL QUALITY MODE
         * --------------------------------------------------------
         */

        if (
          rawTarget === "" ||
          !Number.isFinite(targetKB) ||
          targetKB <= 0
        ) {

          compressBtn.disabled =
            true;

          const oldHTML =
            compressBtn.innerHTML;

          compressBtn.innerHTML =
            "Compressing...";


          try {

            await nextFrame();

            const result =
              await encodeAtQuality(
                selectedImage,
                manualQuality,
                1
              );

            compressedBlob =
              result.blob;

            showCompressedResult(
              compressedBlob
            );

          } catch (error) {

            console.error(error);

            alert(
              "Compression failed."
            );

          } finally {

            compressBtn.disabled =
              false;

            compressBtn.innerHTML =
              oldHTML;
          }

          return;
        }


        /*
         * --------------------------------------------------------
         * TARGET SIZE MODE
         * --------------------------------------------------------
         */

        targetKB =
          Math.max(
            1,
            targetKB
          );


        const targetBytes =
          targetKB * 1024;


        compressBtn.disabled =
          true;


        const originalButtonHTML =
          compressBtn.innerHTML;


        compressBtn.innerHTML =
          '<span class="spinner"></span>' +
          "Optimizing...";


        try {

          /*
           * Run the precision engine.
           */
          const result =
            await findTargetSize(
              selectedImage,
              targetBytes,
              manualQuality
            );


          if (
            !result ||
            !result.blob
          ) {
            throw new Error(
              "No compression result."
            );
          }


          compressedBlob =
            result.blob;


          showCompressedResult(
            compressedBlob
          );


        } catch (error) {

          console.error(
            "Compression failed:",
            error
          );

          alert(
            "Compression failed. Please try again."
          );

        } finally {

          compressBtn.disabled =
            false;

          compressBtn.innerHTML =
            originalButtonHTML;
        }

      }
    );
  }


  /* ============================================================
     SHOW RESULT
     ============================================================ */

  function showCompressedResult(
    blob
  ) {

    if (!blob) {
      return;
    }


    /*
     * Release previous object URL.
     */
    if (compressedObjectURL) {

      URL.revokeObjectURL(
        compressedObjectURL
      );
    }


    compressedObjectURL =
      URL.createObjectURL(
        blob
      );


    /*
     * Preview.
     */
    if (compressedPreview) {

      compressedPreview.src =
        compressedObjectURL;
    }


    /*
     * Size.
     */
    if (compressedSize) {

      compressedSize.textContent =
        "Compressed Size: " +
        formatBytes(blob.size);
    }


    /*
     * Optional compression percentage.
     */
    const originalSizeElement =
      document.getElementById(
        "originalSize"
      );


    if (
      originalSizeElement &&
      selectedFile
    ) {

      const saved =
        (
          1 -
          blob.size /
          selectedFile.size
        ) * 100;


      const safeSaved =
        Math.max(
          0,
          saved
        );


      originalSizeElement.textContent =
        "Original: " +
        formatBytes(
          selectedFile.size
        ) +
        " • Saved: " +
        safeSaved.toFixed(1) +
        "%";
    }


    /*
     * Optional result section.
     */
    const resultSection =
      document.getElementById(
        "resultSection"
      );


    if (resultSection) {

      resultSection.classList.remove(
        "hidden-section"
      );


      setTimeout(() => {

        resultSection.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      }, 100);
    }
  }


  /* ============================================================
     DOWNLOAD
     ============================================================ */

  function downloadBlob(
    blob,
    filename
  ) {

    if (!blob) {

      alert(
        "Please compress an image first."
      );

      return;
    }


    const url =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");


    link.href =
      url;

    link.download =
      filename;


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    setTimeout(() => {

      URL.revokeObjectURL(
        url
      );

    }, 1500);
  }


  /* ============================================================
     CONVERT RESULT TO JPEG
     ============================================================ */

  async function createDownloadJPEG() {

    if (!compressedBlob) {
      return null;
    }


    /*
     * The compressed result is already JPEG in the normal
     * compression path, so return it directly.
     */
    if (
      compressedBlob.type ===
      "image/jpeg"
    ) {

      return compressedBlob;
    }


    const img =
      await loadImageFromFile(
        compressedBlob
      );


    const canvas =
      createCanvas(
        img,
        1
      );


    return await canvasToJPEG(
      canvas,
      0.95
    );
  }


  /* ============================================================
     DOWNLOAD JPG
     ============================================================ */

  if (downloadJpg) {

    downloadJpg.addEventListener(
      "click",
      async () => {

        if (!compressedBlob) {

          alert(
            "Please compress an image first."
          );

          return;
        }


        try {

          downloadJpg.disabled =
            true;


          const blob =
            await createDownloadJPEG();


          downloadBlob(
            blob,
            "compressed-image.jpg"
          );


        } catch (error) {

          console.error(error);

          alert(
            "Unable to create JPG."
          );

        } finally {

          downloadJpg.disabled =
            false;
        }
      }
    );
  }


  /* ============================================================
     DOWNLOAD PNG
     ============================================================ */

  if (downloadPng) {

    downloadPng.addEventListener(
      "click",
      async () => {

        if (!compressedBlob) {

          alert(
            "Please compress an image first."
          );

          return;
        }


        try {

          downloadPng.disabled =
            true;


          /*
           * Load the compressed JPEG and render it to a PNG
           * canvas.
           */
          const img =
            await loadImageFromFile(
              compressedBlob
            );


          const canvas =
            createCanvas(
              img,
              1
            );


          const pngBlob =
            await new Promise(
              (resolve, reject) => {

                canvas.toBlob(
                  blob => {

                    if (!blob) {

                      reject(
                        new Error(
                          "PNG creation failed."
                        )
                      );

                      return;
                    }

                    resolve(blob);
                  },

                  "image/png"
                );
              }
            );


          downloadBlob(
            pngBlob,
            "compressed-image.png"
          );


        } catch (error) {

          console.error(error);

          alert(
            "Unable to create PNG."
          );

        } finally {

          downloadPng.disabled =
            false;
        }
      }
    );
  }


  /* ============================================================
     CLEANUP
     ============================================================ */

  window.addEventListener(
    "beforeunload",
    () => {

      if (compressedObjectURL) {

        URL.revokeObjectURL(
          compressedObjectURL
        );
      }
    }
  );

})();
</script>
