<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />

  <title>Smart Image Compressor</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      font-family: Inter, Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      color: #172033;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    button,
    input {
      font-family: inherit;
    }

    .app {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding:
        calc(20px + env(safe-area-inset-top))
        18px
        calc(80px + env(safe-area-inset-bottom));
    }

    .logo-box {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: #eaf4ff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-box i {
      color: #1d7edb;
      font-size: 22px;
    }

    .brand-title {
      color: #1d7edb;
      font-weight: 750;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: -0.35px;
    }

    .subtitle {
      color: #8a93a1;
      font-size: 13px;
      margin-top: 4px;
    }

    .select-btn {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 13px;
      background: #1d7edb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(29, 126, 219, 0.18);
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .select-btn:active,
    .action-btn:active,
    .download-btn:active {
      transform: scale(0.98);
    }

    .select-btn:hover {
      background: #176fbf;
    }

    .card {
      border: 1px solid #e9edf2;
      border-radius: 16px;
      background: #fff;
      overflow: hidden;
    }

    .preview-wrap {
      background: #f7f9fb;
      padding: 10px;
    }

    .preview-image {
      display: block;
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      border-radius: 10px;
      background:
        linear-gradient(45deg, #f1f3f5 25%, transparent 25%),
        linear-gradient(-45deg, #f1f3f5 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #f1f3f5 75%),
        linear-gradient(-45deg, transparent 75%, #f1f3f5 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }

    .section-label {
      color: #303846;
      font-size: 14px;
      font-weight: 700;
    }

    .input-label {
      display: block;
      color: #596273;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .number-input {
      width: 100%;
      height: 46px;
      border: 1px solid #dce2e9;
      border-radius: 10px;
      padding: 0 13px;
      outline: none;
      font-size: 15px;
      color: #1d2633;
      background: #fff;
    }

    .number-input:focus {
      border-color: #1d7edb;
      box-shadow: 0 0 0 3px rgba(29, 126, 219, 0.08);
    }

    .quality-value {
      color: #1d7edb;
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      height: 5px;
      accent-color: #1d7edb;
      cursor: pointer;
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      color: #9aa2ad;
      font-size: 11px;
      margin-top: 6px;
    }

    .action-btn {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 12px;
      background: #1d7edb;
      color: #fff;
      font-size: 15px;
      font-weight: 750;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .action-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .download-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .download-btn {
      min-height: 48px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .png-btn {
      background: #eaf4ff;
      border: 1px solid #cfe7fb;
      color: #176fbf;
    }

    .jpg-btn {
      background: #f4f5f7;
      border: 1px solid #e0e3e8;
      color: #374151;
    }

    .size-result {
      text-align: center;
      font-size: 14px;
      color: #566171;
    }

    .size-result strong {
      color: #1d7edb;
    }

    .info-box {
      background: #f7faff;
      border: 1px solid #e3f0fb;
      color: #697586;
      border-radius: 11px;
      padding: 11px 12px;
      font-size: 12px;
      line-height: 1.5;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-top-color: white;
      border-radius: 50%;
      display: inline-block;
      vertical-align: -4px;
      margin-right: 7px;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .hidden-section {
      display: none;
    }

    .error {
      color: #d14343;
      background: #fff5f5;
      border: 1px solid #ffdcdc;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
    }

    @media (max-width: 380px) {
      .app {
        padding-left: 14px;
        padding-right: 14px;
      }

      .brand-title {
        font-size: 20px;
      }

      .download-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- HEADER -->
    <header class="flex items-center gap-3 mb-7">
      <div class="logo-box">
        <i class="fa-solid fa-file-image"></i>
      </div>

      <div>
        <h1 class="brand-title">
          Smart Image Compressor
        </h1>

        <p class="subtitle">
          Serverless, Ultra-fast &amp; 100% Secure
        </p>
      </div>
    </header>


    <!-- FILE SELECT -->
    <section>
      <input
        id="fileInput"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        hidden
      />

      <button
        id="selectBtn"
        class="select-btn"
        type="button"
      >
        <i class="fa-solid fa-folder-open mr-2"></i>
        Select Photo
      </button>
    </section>


    <!-- ERROR -->
    <div
      id="errorBox"
      class="error hidden-section mt-4"
    ></div>


    <!-- ORIGINAL IMAGE -->
    <section
      id="originalSection"
      class="hidden-section mt-5"
    >
      <div class="flex items-center justify-between mb-2">
        <span class="section-label">
          Original Image
        </span>

        <span
          id="originalSize"
          class="text-xs text-gray-400"
        ></span>
      </div>

      <div class="card">
        <div class="preview-wrap">
          <img
            id="originalPreview"
            class="preview-image"
            alt="Original image preview"
          />
        </div>
      </div>
    </section>


    <!-- SETTINGS -->
    <section
      id="settingsSection"
      class="hidden-section mt-5"
    >

      <div class="section-label mb-3">
        Compression Settings
      </div>

      <div class="card p-4">

        <!-- TARGET SIZE -->
        <div>
          <label
            for="targetKB"
            class="input-label"
          >
            Target Size
          </label>

          <div class="relative">
            <input
              id="targetKB"
              class="number-input pr-14"
              type="number"
              min="1"
              max="50000"
              step="1"
              value="100"
              inputmode="numeric"
              placeholder="100"
            />

            <span
              class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-gray-400"
            >
              KB
            </span>
          </div>
        </div>


        <!-- QUALITY -->
        <div class="mt-5">

          <div class="flex justify-between items-center mb-2">
            <label
              for="qualitySlider"
              class="input-label mb-0"
            >
              Quality
            </label>

            <span
              id="qualityValue"
              class="quality-value text-sm"
            >
              80%
            </span>
          </div>

          <input
            id="qualitySlider"
            type="range"
            min="0"
            max="100"
            value="80"
          />

          <div class="range-labels">
            <span>More Compression</span>
            <span>Better Quality</span>
          </div>

        </div>

      </div>
    </section>


    <!-- COMPRESS BUTTON -->
    <section
      id="compressSection"
      class="hidden-section mt-5"
    >
      <button
        id="compressBtn"
        class="action-btn"
        type="button"
      >
        <i class="fa-solid fa-compress mr-2"></i>
        Compress Image
      </button>

      <div class="info-box mt-3">
        <i class="fa-solid fa-shield-halved mr-1"></i>
        Your image never leaves this device. Compression happens locally
        inside your browser.
      </div>
    </section>


    <!-- RESULT -->
    <section
      id="resultSection"
      class="hidden-section mt-6"
    >

      <div class="flex items-center justify-between mb-2">
        <span class="section-label">
          Compressed Image
        </span>

        <span
          id="compressionRatio"
          class="text-xs text-gray-400"
        ></span>
      </div>

      <div class="card">

        <div class="preview-wrap">
          <img
            id="compressedPreview"
            class="preview-image"
            alt="Compressed image preview"
          />
        </div>

        <div class="p-4">

          <div
            id="compressedSize"
            class="size-result mb-4"
          ></div>

          <div class="download-grid">

            <button
              id="pngBtn"
              class="download-btn png-btn"
              type="button"
            >
              <i class="fa-solid fa-image mr-1"></i>
              Download as PNG
            </button>

            <button
              id="jpgBtn"
              class="download-btn jpg-btn"
              type="button"
            >
              <i class="fa-solid fa-image mr-1"></i>
              Download as JPG
            </button>

          </div>

        </div>
      </div>
    </section>

  </main>


  <script>
    /*
     * ============================================================
     * SMART IMAGE COMPRESSOR
     * 100% CLIENT-SIDE
     * ============================================================
     */

    // ------------------------------------------------------------
    // TELEGRAM WEB APP
    // ------------------------------------------------------------

    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();

      // Keep the Mini App background white
      try {
        tg.setHeaderColor("#ffffff");
        tg.setBackgroundColor("#ffffff");

        if (tg.setBottomBarColor) {
          tg.setBottomBarColor("#ffffff");
        }
      } catch (e) {
        console.log("Telegram theme API unavailable:", e);
      }
    }


    // ------------------------------------------------------------
    // ELEMENTS
    // ------------------------------------------------------------

    const fileInput = document.getElementById("fileInput");
    const selectBtn = document.getElementById("selectBtn");

    const errorBox = document.getElementById("errorBox");

    const originalSection =
      document.getElementById("originalSection");

    const originalPreview =
      document.getElementById("originalPreview");

    const originalSize =
      document.getElementById("originalSize");

    const settingsSection =
      document.getElementById("settingsSection");

    const targetKB =
      document.getElementById("targetKB");

    const qualitySlider =
      document.getElementById("qualitySlider");

    const qualityValue =
      document.getElementById("qualityValue");

    const compressSection =
      document.getElementById("compressSection");

    const compressBtn =
      document.getElementById("compressBtn");

    const resultSection =
      document.getElementById("resultSection");

    const compressedPreview =
      document.getElementById("compressedPreview");

    const compressedSize =
      document.getElementById("compressedSize");

    const compressionRatio =
      document.getElementById("compressionRatio");

    const pngBtn =
      document.getElementById("pngBtn");

    const jpgBtn =
      document.getElementById("jpgBtn");


    // ------------------------------------------------------------
    // STATE
    // ------------------------------------------------------------

    let selectedFile = null;
    let originalImage = null;
    let compressedBlob = null;
    let compressedURL = null;


    // ------------------------------------------------------------
    // HELPERS
    // ------------------------------------------------------------

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.remove("hidden-section");
    }

    function hideError() {
      errorBox.textContent = "";
      errorBox.classList.add("hidden-section");
    }

    function formatBytes(bytes) {
      if (!bytes || bytes <= 0) return "0 KB";

      const kb = bytes / 1024;

      if (kb < 1024) {
        return kb.toFixed(kb < 10 ? 1 : 0) + " KB";
      }

      const mb = kb / 1024;

      return mb.toFixed(mb < 10 ? 2 : 1) + " MB";
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function yieldToBrowser() {
      return new Promise(resolve => {
        setTimeout(resolve, 0);
      });
    }


    // ------------------------------------------------------------
    // QUALITY SLIDER
    // ------------------------------------------------------------

    qualitySlider.addEventListener("input", () => {
      qualityValue.textContent =
        qualitySlider.value + "%";
    });


    // ------------------------------------------------------------
    // SELECT PHOTO
    // ------------------------------------------------------------

    selectBtn.addEventListener("click", () => {
      hideError();

      // Reset input so selecting the same image again works
      fileInput.value = "";

      fileInput.click();
    });


    fileInput.addEventListener("change", async (event) => {

      hideError();

      const file = event.target.files?.[0];

      if (!file) return;

      if (!file.type.startsWith("image/")) {
        showError("Please select a valid image.");
        return;
      }

      const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
      ];

      if (!allowedTypes.includes(file.type)) {
        showError(
          "Supported formats: JPEG, PNG and WEBP."
        );
        return;
      }

      // Prevent extremely large browser-memory operations
      if (file.size > 100 * 1024 * 1024) {
        showError(
          "This image is larger than 100 MB. Please select a smaller image."
        );
        return;
      }

      selectedFile = file;

      // Clear previous result
      resultSection.classList.add("hidden-section");

      if (compressedURL) {
        URL.revokeObjectURL(compressedURL);
        compressedURL = null;
      }

      compressedBlob = null;

      // Display original image
      const url = URL.createObjectURL(file);

      originalPreview.onload = () => {
        URL.revokeObjectURL(url);
      };

      originalPreview.src = url;

      originalSize.textContent =
        formatBytes(file.size);

      originalSection.classList.remove(
        "hidden-section"
      );

      settingsSection.classList.remove(
        "hidden-section"
      );

      compressSection.classList.remove(
        "hidden-section"
      );

      // Default target size based on original image
      const originalKB = Math.round(file.size / 1024);

      if (originalKB <= 50) {
        targetKB.value = Math.max(1, originalKB);
      } else if (originalKB <= 200) {
        targetKB.value = 100;
      } else if (originalKB <= 1000) {
        targetKB.value = 200;
      } else {
        targetKB.value = 500;
      }

      try {
        originalImage =
          await loadImage(file);

      } catch (error) {
        console.error(error);

        showError(
          "Unable to read this image. Please try another file."
        );
      }
    });


    // ------------------------------------------------------------
    // LOAD IMAGE
    // ------------------------------------------------------------

    function loadImage(file) {

      return new Promise((resolve, reject) => {

        const url = URL.createObjectURL(file);

        const img = new Image();

        img.onload = () => {
          URL.revokeObjectURL(url);
          resolve(img);
        };

        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(
            new Error("Could not load image")
          );
        };

        img.src = url;
      });
    }


    // ------------------------------------------------------------
    // CANVAS CREATION
    // ------------------------------------------------------------

    function createCanvasForImage(
      img,
      scale = 1
    ) {

      let width =
        Math.max(1, Math.round(img.naturalWidth * scale));

      let height =
        Math.max(1, Math.round(img.naturalHeight * scale));

      // Keep browser memory usage reasonable
      const maxDimension = 4096;

      if (
        width > maxDimension ||
        height > maxDimension
      ) {

        const factor =
          maxDimension /
          Math.max(width, height);

        width =
          Math.max(1, Math.round(width * factor));

        height =
          Math.max(1, Math.round(height * factor));
      }

      const canvas =
        document.createElement("canvas");

      canvas.width = width;
      canvas.height = height;

      const ctx =
        canvas.getContext("2d", {
          alpha: true
        });

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";

      return {
        canvas,
        ctx,
        width,
        height
      };
    }


    // ------------------------------------------------------------
    // CANVAS TO BLOB
    // ------------------------------------------------------------

    function canvasToBlob(
      canvas,
      type,
      quality
    ) {

      return new Promise(resolve => {

        canvas.toBlob(
          blob => resolve(blob),
          type,
          quality
        );

      });
    }


    // ------------------------------------------------------------
    // JPEG COMPRESSION
    // ------------------------------------------------------------

    async function compressJPEG(
      img,
      quality,
      scale = 1
    ) {

      const {
        canvas,
        ctx
      } = createCanvasForImage(
        img,
        scale
      );

      // JPEG doesn't support transparency.
      // White background prevents transparent PNG
      // areas becoming black.
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const blob =
        await canvasToBlob(
          canvas,
          "image/jpeg",
          quality
        );

      return {
        blob,
        canvas
      };
    }


    // ------------------------------------------------------------
    // FIND JPEG NEAR TARGET SIZE
    // ------------------------------------------------------------

    async function findBestCompression(
      img,
      targetBytes,
      requestedQuality
    ) {

      /*
       * PNG is not reliably target-size compressible using
       * quality alone. Therefore the working compression
       * format is JPEG.
       *
       * The user's requested quality acts as the starting
       * point. We then search for the closest size.
       */

      let quality =
        clamp(
          requestedQuality / 100,
          0.05,
          1
        );

      let scale = 1;

      let best = null;

      // First attempt
      for (let pass = 0; pass < 8; pass++) {

        await yieldToBrowser();

        const result =
          await compressJPEG(
            img,
            quality,
            scale
          );

        const blob = result.blob;

        if (!blob) {
          throw new Error(
            "Browser could not create compressed image."
          );
        }

        const difference =
          Math.abs(
            blob.size - targetBytes
          );

        if (
          !best ||
          difference < best.difference
        ) {
          best = {
            blob,
            canvas: result.canvas,
            difference,
            quality,
            scale
          };
        }

        /*
         * If the result is larger than target:
         * reduce quality first.
         *
         * If quality gets very low:
         * reduce dimensions.
         */
        if (blob.size > targetBytes) {

          if (quality > 0.25) {
            quality -= 0.10;
          } else {
            scale *= 0.85;
          }

        } else {

          // If substantially below target,
          // increase quality to preserve detail.
          if (quality < 0.95) {
            quality += 0.08;
          } else if (scale < 1) {
            scale = Math.min(
              1,
              scale + 0.08
            );
          } else {
            break;
          }
        }

        quality =
          clamp(quality, 0.05, 1);

        scale =
          clamp(scale, 0.15, 1);
      }

      return best;
    }


    // ------------------------------------------------------------
    // COMPRESS BUTTON
    // ------------------------------------------------------------

    compressBtn.addEventListener(
      "click",
      async () => {

        hideError();

        if (!selectedFile || !originalImage) {
          showError(
            "Please select an image first."
          );
          return;
        }

        let requestedKB =
          Number(targetKB.value);

        if (
          !Number.isFinite(requestedKB) ||
          requestedKB <= 0
        ) {
          showError(
            "Please enter a valid target size in KB."
          );
          return;
        }

        // Don't allow a target above 50 MB
        requestedKB =
          clamp(
            requestedKB,
            1,
            50000
          );

        targetKB.value =
          requestedKB;

        const targetBytes =
          requestedKB * 1024;

        const quality =
          Number(qualitySlider.value);

        compressBtn.disabled = true;

        compressBtn.innerHTML =
          '<span class="spinner"></span>Compressing...';

        try {

          await yieldToBrowser();

          const result =
            await findBestCompression(
              originalImage,
              targetBytes,
              quality
            );

          if (!result || !result.blob) {
            throw new Error(
              "Compression failed."
            );
          }

          compressedBlob =
            result.blob;

          if (compressedURL) {
            URL.revokeObjectURL(
              compressedURL
            );
          }

          compressedURL =
            URL.createObjectURL(
              compressedBlob
            );

          compressedPreview.src =
            compressedURL;

          compressedSize.innerHTML =
            "Compressed Size: <strong>" +
            formatBytes(
              compressedBlob.size
            ) +
            "</strong>";

          const originalBytes =
            selectedFile.size;

          if (originalBytes > 0) {

            const saved =
              Math.max(
                0,
                (
                  1 -
                  compressedBlob.size /
                  originalBytes
                ) * 100
              );

            compressionRatio.textContent =
              saved.toFixed(1) +
              "% smaller";
          }

          resultSection.classList.remove(
            "hidden-section"
          );

          // Scroll result into view
          setTimeout(() => {

            resultSection.scrollIntoView({
              behavior: "smooth",
              block: "start"
            });

          }, 100);

        } catch (error) {

          console.error(
            "Compression error:",
            error
          );

          showError(
            "Compression failed. Please try a different image or target size."
          );

        } finally {

          compressBtn.disabled = false;

          compressBtn.innerHTML =
            '<i class="fa-solid fa-compress mr-2"></i>' +
            'Compress Image';
        }
      }
    );


    // ------------------------------------------------------------
    // DOWNLOAD HELPER
    // ------------------------------------------------------------

    function downloadBlob(
      blob,
      filename
    ) {

      if (!blob) {
        showError(
          "Please compress an image first."
        );
        return;
      }

      const url =
        URL.createObjectURL(blob);

      const a =
        document.createElement("a");

      a.href = url;
      a.download = filename;

      document.body.appendChild(a);

      a.click();

      a.remove();

      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 1000);
    }


    // ------------------------------------------------------------
    // CONVERT CANVAS TO FORMAT
    // ------------------------------------------------------------

    async function convertCompressedTo(
      type,
      quality = 0.92
    ) {

      if (!compressedBlob) {
        throw new Error(
          "No compressed image available."
        );
      }

      const img =
        await loadImage(
          compressedBlob
        );

      const {
        canvas,
        ctx
      } =
        createCanvasForImage(
          img,
          1
        );

      if (type === "image/jpeg") {

        ctx.fillStyle =
          "#ffffff";

        ctx.fillRect(
          0,
          0,
          canvas.width,
          canvas.height
        );
      }

      ctx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
      );

      return await canvasToBlob(
        canvas,
        type,
        quality
      );
    }


    // ------------------------------------------------------------
    // PNG DOWNLOAD
    // ------------------------------------------------------------

    pngBtn.addEventListener(
      "click",
      async () => {

        hideError();

        pngBtn.disabled = true;
        pngBtn.textContent =
          "Preparing...";

        try {

          const pngBlob =
            await convertCompressedTo(
              "image/png"
            );

          downloadBlob(
            pngBlob,
            "compressed-image.png"
          );

        } catch (error) {

          console.error(error);

          showError(
            "Could not create PNG file."
          );

        } finally {

          pngBtn.disabled = false;

          pngBtn.innerHTML =
            '<i class="fa-solid fa-image mr-1"></i>' +
            'Download as PNG';
        }
      }
    );


    // ------------------------------------------------------------
    // JPG DOWNLOAD
    // ------------------------------------------------------------

    jpgBtn.addEventListener(
      "click",
      async () => {

        hideError();

        jpgBtn.disabled = true;
        jpgBtn.textContent =
          "Preparing...";

        try {

          const jpgBlob =
            await convertCompressedTo(
              "image/jpeg",
              0.92
            );

          downloadBlob(
            jpgBlob,
            "compressed-image.jpg"
          );

        } catch (error) {

          console.error(error);

          showError(
            "Could not create JPG file."
          );

        } finally {

          jpgBtn.disabled = false;

          jpgBtn.innerHTML =
            '<i class="fa-solid fa-image mr-1"></i>' +
            'Download as JPG';
        }
      }
    );


    // ------------------------------------------------------------
    // CLEANUP
    // ------------------------------------------------------------

    window.addEventListener(
      "beforeunload",
      () => {

        if (compressedURL) {
          URL.revokeObjectURL(
            compressedURL
          );
        }
      }
    );

  </script>
