<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <title>Image Crop & Resize | InstaPic</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Cropper.js -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"
  ></script>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;

      background: #ffffff;

      font-family:
        Inter,
        Roboto,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #172033;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      -webkit-user-select: none;
      user-select: none;
    }

    .app {
      width: 100%;
      max-width: 620px;

      margin: 0 auto;

      padding:
        calc(20px + env(safe-area-inset-top))
        18px
        calc(100px + env(safe-area-inset-bottom));
    }

    /* ================================
       HEADER
    ================================= */

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 28px;
    }

    .logo {
      width: 46px;
      height: 46px;

      flex: 0 0 46px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;

      background: #eaf4ff;
      color: #1d7edb;

      font-size: 20px;
    }

    .brand-title {
      margin: 0;

      color: #1d7edb;

      font-size: 21px;
      line-height: 1.2;

      font-weight: 750;

      letter-spacing: -0.3px;
    }

    .brand-subtitle {
      margin: 4px 0 0;

      color: #8b95a3;

      font-size: 12.5px;
    }

    /* ================================
       SELECT BUTTON
    ================================= */

    .select-btn {
      width: 100%;
      min-height: 55px;

      border: 0;
      border-radius: 13px;

      background: #1d7edb;
      color: #ffffff;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 6px 18px rgba(29, 126, 219, 0.18);

      transition:
        transform 0.12s ease,
        background 0.15s ease;
    }

    .select-btn:active {
      transform: scale(0.98);
    }

    /* ================================
       EMPTY STATE
    ================================= */

    .empty-state {
      margin-top: 20px;

      padding: 30px 15px;

      border: 1px dashed #dfe5eb;

      border-radius: 13px;

      text-align: center;

      color: #9aa3af;

      font-size: 13px;

      line-height: 1.5;
    }

    .empty-state i {
      display: block;

      margin-bottom: 9px;

      color: #b8c1cb;

      font-size: 28px;
    }

    /* ================================
       CROPPER
    ================================= */

    .crop-wrapper {
      width: 100%;

      overflow: hidden;

      border-radius: 14px;

      background: #111827;

      border: 1px solid #e3e7eb;

      touch-action: none;
    }

    .crop-area {
      width: 100%;

      height: min(72vw, 430px);

      min-height: 260px;

      max-height: 430px;
    }

    .crop-area img {
      display: block;
      max-width: 100%;
    }

    .cropper-container,
    .cropper-wrap-box,
    .cropper-drag-box,
    .cropper-canvas {
      touch-action: none;
    }

    .cropper-view-box {
      outline: 2px solid #ffffff;
      outline-color: rgba(255, 255, 255, 0.95);
    }

    .cropper-modal {
      background-color: #000000;
      opacity: 0.55;
    }

    /* ================================
       SECTION TITLE
    ================================= */

    .section-title {
      color: #303846;

      font-size: 14px;
      font-weight: 700;
    }

    /* ================================
       RATIO BUTTONS
    ================================= */

    .ratio-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 8px;

      margin-top: 10px;
    }

    .ratio-btn {
      min-height: 45px;

      border-radius: 10px;

      border: 1px solid #dfe4ea;

      background: #ffffff;

      color: #5d6877;

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;

      transition: all 0.15s ease;
    }

    .ratio-btn:active {
      transform: scale(0.97);
    }

    .ratio-btn.active {
      background: #edf7ff;

      color: #1d7edb;

      border-color: #1d7edb;
    }

    /* ================================
       DIMENSIONS
    ================================= */

    .dimension-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 10px;

      margin-top: 18px;
    }

    .input-label {
      display: block;

      margin-bottom: 6px;

      color: #687384;

      font-size: 12px;

      font-weight: 600;
    }

    .dimension-input {
      width: 100%;

      height: 47px;

      padding: 0 12px;

      border-radius: 10px;

      border: 1px solid #dfe4ea;

      background: #ffffff;

      color: #202938;

      font-size: 14px;

      outline: none;

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .dimension-input:focus {
      border-color: #1d7edb;

      box-shadow:
        0 0 0 3px rgba(29, 126, 219, 0.09);
    }

    /* ================================
       ASPECT RATIO
    ================================= */

    .aspect-row {
      display: flex;

      align-items: center;

      gap: 9px;

      margin-top: 13px;

      color: #687384;

      font-size: 12.5px;

      cursor: pointer;

      user-select: none;
    }

    .aspect-row input {
      width: 17px;
      height: 17px;

      accent-color: #1d7edb;
    }

    /* ================================
       APPLY BUTTON
    ================================= */

    .apply-btn {
      width: 100%;

      min-height: 53px;

      margin-top: 19px;

      border: 0;

      border-radius: 12px;

      background: #10b981;

      color: #ffffff;

      font-size: 15px;

      font-weight: 750;

      cursor: pointer;

      box-shadow:
        0 6px 18px rgba(16, 185, 129, 0.16);

      transition:
        transform 0.12s ease,
        opacity 0.15s ease;
    }

    .apply-btn:active {
      transform: scale(0.98);
    }

    .apply-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* ================================
       INFO
    ================================= */

    .info-box {
      margin-top: 12px;

      padding: 11px 12px;

      border-radius: 10px;

      border: 1px solid #e4f0fb;

      background: #f7fbff;

      color: #738091;

      font-size: 12px;

      line-height: 1.5;
    }

    /* ================================
       SPINNER
    ================================= */

    .spinner {
      display: inline-block;

      width: 18px;
      height: 18px;

      margin-right: 7px;

      vertical-align: -4px;

      border:
        2px solid
        rgba(255, 255, 255, 0.4);

      border-top-color: #ffffff;

      border-radius: 50%;

      animation:
        spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ================================
       BOTTOM SAFE SPACE
    ================================= */

    .bottom-space {
      height: 96px;
    }

    @media (max-width: 380px) {

      .app {
        padding-left: 14px;
        padding-right: 14px;
      }

      .brand-title {
        font-size: 19px;
      }

      .crop-area {
        min-height: 230px;
      }

    }
  </style>
</head>

<body>

  <main class="app">

    <!-- HEADER -->

    <header class="brand">

      <div class="logo">
        <i class="fa-solid fa-crop-simple"></i>
      </div>

      <div>

        <h1 class="brand-title">
          Image Crop &amp; Resize
        </h1>

        <p class="brand-subtitle">
          Fast, Simple &amp; 100% Client-Side
        </p>

      </div>

    </header>


    <!-- FILE INPUT -->

    <input
      id="imageInput"
      type="file"
      accept="image/jpeg,image/png,image/webp"
      hidden
    >


    <!-- SELECT PHOTO -->

    <button
      id="selectBtn"
      class="select-btn"
      type="button"
    >
      <i class="fa-solid fa-folder-open mr-2"></i>
      Select Photo
    </button>


    <!-- EMPTY STATE -->

    <div
      id="emptyState"
      class="empty-state"
    >

      <i class="fa-regular fa-image"></i>

      Select a photo to crop and resize it.

    </div>


    <!-- TOOL -->

    <section
      id="toolSection"
      class="hidden mt-5"
    >

      <!-- CROPPER -->

      <div class="crop-wrapper">

        <div class="crop-area">

          <img
            id="cropImage"
            alt="Image to crop"
            draggable="false"
          >

        </div>

      </div>


      <!-- CROP RATIO -->

      <div class="mt-5">

        <div class="section-title">
          Crop Ratio
        </div>


        <div
          id="ratioGrid"
          class="ratio-grid"
        >

          <button
            type="button"
            class="ratio-btn active"
            data-ratio="free"
          >
            Free Crop
          </button>

          <button
            type="button"
            class="ratio-btn"
            data-ratio="1"
          >
            1:1 Square
          </button>

          <button
            type="button"
            class="ratio-btn"
            data-ratio="1.7777777778"
          >
            16:9 Landscape
          </button>

          <button
            type="button"
            class="ratio-btn"
            data-ratio="1.3333333333"
          >
            4:3 Standard
          </button>

        </div>

      </div>


      <!-- WIDTH / HEIGHT -->

      <div class="dimension-grid">

        <div>

          <label
            class="input-label"
            for="widthInput"
          >
            Width (px)
          </label>

          <input
            id="widthInput"
            class="dimension-input"
            type="number"
            min="1"
            max="16000"
            inputmode="numeric"
            placeholder="Width"
          >

        </div>


        <div>

          <label
            class="input-label"
            for="heightInput"
          >
            Height (px)
          </label>

          <input
            id="heightInput"
            class="dimension-input"
            type="number"
            min="1"
            max="16000"
            inputmode="numeric"
            placeholder="Height"
          >

        </div>

      </div>


      <!-- MAINTAIN ASPECT -->

      <label
        class="aspect-row"
        for="aspectRatio"
      >

        <input
          id="aspectRatio"
          type="checkbox"
          checked
        >

        <span>
          Maintain Aspect Ratio
        </span>

      </label>


      <!-- APPLY -->

      <button
        id="applyBtn"
        class="apply-btn"
        type="button"
      >

        <i class="fa-solid fa-download mr-2"></i>

        Apply &amp; Download

      </button>


      <!-- INFO -->

      <div class="info-box">

        <i class="fa-solid fa-shield-halved mr-1"></i>

        Your image is processed completely on your device.
        No image is uploaded to any server.

      </div>

    </section>


    <!-- TELEGRAM SAFE BOTTOM SPACE -->

    <div class="bottom-space"></div>

  </main>


  <script>
    (() => {

      "use strict";


      /* =====================================================
         TELEGRAM WEB APP INITIALIZATION
      ===================================================== */

      const tg =
        window.Telegram &&
        window.Telegram.WebApp;


      if (tg) {

        try {

          tg.ready();

          tg.expand();

          if (typeof tg.setHeaderColor === "function") {
            tg.setHeaderColor("#ffffff");
          }

          if (typeof tg.setBackgroundColor === "function") {
            tg.setBackgroundColor("#ffffff");
          }

          if (typeof tg.setBottomBarColor === "function") {
            tg.setBottomBarColor("#ffffff");
          }

        } catch (error) {

          console.warn(
            "Telegram WebApp initialization:",
            error
          );

        }

      }


      /* =====================================================
         DOM
      ===================================================== */

      const imageInput =
        document.getElementById("imageInput");

      const selectBtn =
        document.getElementById("selectBtn");

      const emptyState =
        document.getElementById("emptyState");

      const toolSection =
        document.getElementById("toolSection");

      const cropImage =
        document.getElementById("cropImage");

      const ratioGrid =
        document.getElementById("ratioGrid");

      const widthInput =
        document.getElementById("widthInput");

      const heightInput =
        document.getElementById("heightInput");

      const aspectRatio =
        document.getElementById("aspectRatio");

      const applyBtn =
        document.getElementById("applyBtn");


      /* =====================================================
         STATE
      ===================================================== */

      let selectedFile = null;

      let cropper = null;

      let imageObjectURL = null;

      let originalAspectRatio = 1;

      const MAX_OUTPUT_DIMENSION = 16000;


      /* =====================================================
         SELECT BUTTON
      ===================================================== */

      selectBtn.addEventListener(
        "click",
        () => {

          imageInput.value = "";

          imageInput.click();

        }
      );


      /* =====================================================
         IMAGE SELECTION
      ===================================================== */

      imageInput.addEventListener(
        "change",
        event => {

          const file =
            event.target.files &&
            event.target.files[0];


          if (!file) {
            return;
          }


          /*
           * Accept only actual image files.
           */
          if (
            ![
              "image/jpeg",
              "image/png",
              "image/webp"
            ].includes(file.type)
          ) {

            alert(
              "Please select a JPG, PNG or WEBP image."
            );

            return;

          }


          selectedFile = file;


          /*
           * Remove old object URL.
           */
          if (imageObjectURL) {

            URL.revokeObjectURL(
              imageObjectURL
            );

          }


          imageObjectURL =
            URL.createObjectURL(file);


          /*
           * Destroy old Cropper.
           */
          if (cropper) {

            cropper.destroy();

            cropper = null;

          }


          cropImage.onload =
            () => {

              originalAspectRatio =
                cropImage.naturalWidth /
                cropImage.naturalHeight;


              widthInput.value =
                Math.min(
                  cropImage.naturalWidth,
                  MAX_OUTPUT_DIMENSION
                );


              heightInput.value =
                Math.min(
                  cropImage.naturalHeight,
                  MAX_OUTPUT_DIMENSION
                );


              initializeCropper();

            };


          cropImage.src =
            imageObjectURL;


          emptyState.classList.add(
            "hidden"
          );


          toolSection.classList.remove(
            "hidden"
          );

        }
      );


      /* =====================================================
         CROPPER INITIALIZATION
      ===================================================== */

      function initializeCropper() {

        if (
          typeof Cropper ===
          "undefined"
        ) {

          alert(
            "Cropper.js could not be loaded. Please reopen the app with an internet connection."
          );

          return;

        }


        cropper =
          new Cropper(
            cropImage,
            {

              aspectRatio: NaN,

              viewMode: 1,

              dragMode: "crop",

              responsive: true,

              restore: true,

              checkOrientation: true,

              zoomable: true,

              zoomOnTouch: true,

              zoomOnWheel: true,

              movable: true,

              rotatable: false,

              scalable: false,

              guides: true,

              center: true,

              highlight: true,

              background: false,

              autoCrop: true,

              autoCropArea: 0.9,

              cropBoxMovable: true,

              cropBoxResizable: true,

              toggleDragModeOnDblclick: false

            }
          );

      }


      /* =====================================================
         RATIO BUTTONS
      ===================================================== */

      ratioGrid.addEventListener(
        "click",
        event => {

          const button =
            event.target.closest(
              ".ratio-btn"
            );


          if (!button) {
            return;
          }


          const ratio =
            button.dataset.ratio;


          ratioGrid
            .querySelectorAll(
              ".ratio-btn"
            )
            .forEach(
              item => {

                item.classList.toggle(
                  "active",
                  item === button
                );

              }
            );


          if (!cropper) {
            return;
          }


          if (ratio === "free") {

            cropper.setAspectRatio(
              NaN
            );

          } else {

            cropper.setAspectRatio(
              Number(ratio)
            );

          }


          setTimeout(
            updateDimensionInputsFromCrop,
            50
          );

        }
      );


      /* =====================================================
         UPDATE DIMENSIONS
      ===================================================== */

      function updateDimensionInputsFromCrop() {

        if (!cropper) {
          return;
        }


        const data =
          cropper.getData();


        if (
          data &&
          Number.isFinite(data.width) &&
          Number.isFinite(data.height)
        ) {

          widthInput.value =
            Math.round(data.width);

          heightInput.value =
            Math.round(data.height);

        }

      }


      /* =====================================================
         WIDTH CHANGE
      ===================================================== */

      widthInput.addEventListener(
        "input",
        () => {

          if (!cropper) {
            return;
          }


          let width =
            Number(
              widthInput.value
            );


          if (
            !Number.isFinite(width) ||
            width <= 0
          ) {

            return;

          }


          width =
            Math.min(
              width,
              MAX_OUTPUT_DIMENSION
            );


          if (aspectRatio.checked) {

            const data =
              cropper.getData();


            const ratio =
              data.height > 0
                ? data.width / data.height
                : originalAspectRatio;


            const height =
              Math.round(
                width / ratio
              );


            heightInput.value =
              Math.min(
                height,
                MAX_OUTPUT_DIMENSION
              );

          }

        }
      );


      /* =====================================================
         HEIGHT CHANGE
      ===================================================== */

      heightInput.addEventListener(
        "input",
        () => {

          if (!cropper) {
            return;
          }


          let height =
            Number(
              heightInput.value
            );


          if (
            !Number.isFinite(height) ||
            height <= 0
          ) {

            return;

          }


          height =
            Math.min(
              height,
              MAX_OUTPUT_DIMENSION
            );


          if (aspectRatio.checked) {

            const data =
              cropper.getData();


            const ratio =
              data.height > 0
                ? data.width / data.height
                : originalAspectRatio;


            const width =
              Math.round(
                height * ratio
              );


            widthInput.value =
              Math.min(
                width,
                MAX_OUTPUT_DIMENSION
              );

          }

        }
      );


      /* =====================================================
         OUTPUT DIMENSIONS
      ===================================================== */

      function getOutputDimensions() {

        let width =
          parseInt(
            widthInput.value,
            10
          );


        let height =
          parseInt(
            heightInput.value,
            10
          );


        const cropData =
          cropper.getData();


        if (
          !Number.isFinite(width) ||
          width <= 0
        ) {

          width =
            Math.round(
              cropData.width
            );

        }


        if (
          !Number.isFinite(height) ||
          height <= 0
        ) {

          height =
            Math.round(
              cropData.height
            );

        }


        width =
          Math.max(
            1,
            Math.min(
              width,
              MAX_OUTPUT_DIMENSION
            )
          );


        height =
          Math.max(
            1,
            Math.min(
              height,
              MAX_OUTPUT_DIMENSION
            )
          );


        /*
         * Final aspect-ratio protection.
         */
        if (
          aspectRatio.checked
        ) {

          const ratio =
            cropData.height > 0
              ? cropData.width /
                cropData.height
              : originalAspectRatio;


          const requestedWidth =
            parseInt(
              widthInput.value,
              10
            );


          if (
            Number.isFinite(
              requestedWidth
            ) &&
            requestedWidth > 0
          ) {

            width =
              Math.min(
                requestedWidth,
                MAX_OUTPUT_DIMENSION
              );


            height =
              Math.round(
                width / ratio
              );

          }


          if (
            height >
            MAX_OUTPUT_DIMENSION
          ) {

            height =
              MAX_OUTPUT_DIMENSION;


            width =
              Math.round(
                height * ratio
              );

          }


          if (
            width >
            MAX_OUTPUT_DIMENSION
          ) {

            width =
              MAX_OUTPUT_DIMENSION;


            height =
              Math.round(
                width / ratio
              );

          }

        }


        return {
          width,
          height
        };

      }


      /* =====================================================
         CANVAS → BLOB
      ===================================================== */

      function canvasToBlob(
        canvas,
        type,
        quality
      ) {

        return new Promise(
          (resolve, reject) => {

            try {

              canvas.toBlob(
                blob => {

                  if (!blob) {

                    reject(
                      new Error(
                        "Canvas failed to create image."
                      )
                    );

                    return;

                  }


                  resolve(blob);

                },

                type,

                quality

              );

            } catch (error) {

              reject(error);

            }

          }
        );

      }


      /* =====================================================
         CREATE FINAL IMAGE
      ===================================================== */

      async function createOutputBlob() {

        const dimensions =
          getOutputDimensions();


        /*
         * Cropper performs the actual crop and resize.
         */
        const canvas =
          cropper.getCroppedCanvas({

            width:
              dimensions.width,

            height:
              dimensions.height,

            minWidth:
              1,

            minHeight:
              1,

            maxWidth:
              MAX_OUTPUT_DIMENSION,

            maxHeight:
              MAX_OUTPUT_DIMENSION,

            fillColor:
              "#ffffff",

            imageSmoothingEnabled:
              true,

            imageSmoothingQuality:
              "high"

          });


        if (!canvas) {

          throw new Error(
            "Could not create output canvas."
          );

        }


        /*
         * JPEG is intentional because the requested
         * output filename is instapic_resized.jpg.
         */
        return await canvasToBlob(
          canvas,
          "image/jpeg",
          0.92
        );

      }


      /* =====================================================
         TELEGRAM / MOBILE SAFE DOWNLOAD SYSTEM
         
         IMPORTANT:
         
         Desktop:
             normal <a download>

         Mobile / Telegram:
             Web Share API with File

         Fallback:
             open generated Blob URL
         
         Nothing is uploaded to a server.
      ===================================================== */

      async function downloadFile(
        blob,
        filename
      ) {

        if (!blob) {

          throw new Error(
            "Download data is empty."
          );

        }


        const file =
          new File(
            [blob],
            filename,
            {
              type:
                blob.type ||
                "image/jpeg"
            }
          );


        /*
         * =================================================
         * METHOD 1
         * Web Share API
         *
         * This is the most useful path on mobile
         * Telegram WebViews where <a download> can be
         * ignored by the embedded browser.
         * =================================================
         */

        if (
          typeof navigator.share ===
          "function"
        ) {

          try {

            let canShareFiles =
              true;


            if (
              typeof navigator.canShare ===
              "function"
            ) {

              canShareFiles =
                navigator.canShare({
                  files: [file]
                });

            }


            if (canShareFiles) {

              await navigator.share({

                files: [file],

                title:
                  filename,

                text:
                  "InstaPic processed image"

              });


              return true;

            }

          } catch (error) {

            /*
             * AbortError means the user closed
             * the share sheet. Do not show an error.
             */
            if (
              error &&
              error.name ===
                "AbortError"
            ) {

              return false;

            }


            console.warn(
              "Web Share unavailable:",
              error
            );

          }

        }


        /*
         * =================================================
         * METHOD 2
         * Standard browser download
         *
         * Works normally on desktop Chrome and browsers
         * which support download attribute.
         * =================================================
         */

        const objectURL =
          URL.createObjectURL(
            blob
          );


        try {

          const link =
            document.createElement(
              "a"
            );


          link.href =
            objectURL;


          link.download =
            filename;


          link.rel =
            "noopener";


          link.style.display =
            "none";


          document.body.appendChild(
            link
          );


          /*
           * MouseEvent provides better compatibility
           * with some embedded browsers.
           */
          link.dispatchEvent(
            new MouseEvent(
              "click",
              {
                bubbles: true,
                cancelable: true,
                view: window
              }
            )
          );


          /*
           * Also call click() for browsers that do not
           * respond to dispatchEvent.
           */
          try {

            link.click();

          } catch (_) {}


          link.remove();


          /*
           * Give the browser time to start the download.
           */
          setTimeout(
            () => {

              URL.revokeObjectURL(
                objectURL
              );

            },
            5000
          );


          /*
           * The anchor method has been triggered.
           */
          return true;

        } catch (error) {

          console.warn(
            "Standard download failed:",
            error
          );

        }


        /*
         * =================================================
         * METHOD 3
         * Blob URL fallback.
         *
         * This opens the processed image directly in the
         * WebView. The user can use Telegram/browser's
         * native Save/Share action.
         * =================================================
         */

        try {

          window.open(
            objectURL,
            "_blank"
          );


          setTimeout(
            () => {

              URL.revokeObjectURL(
                objectURL
              );

            },
            10000
          );


          return true;

        } catch (error) {

          URL.revokeObjectURL(
            objectURL
          );

          throw error;

        }

      }


      /* =====================================================
         APPLY & DOWNLOAD
      ===================================================== */

      applyBtn.addEventListener(
        "click",
        async () => {

          if (!selectedFile) {

            alert(
              "Please select a photo first."
            );

            return;

          }


          if (!cropper) {

            alert(
              "Crop editor is not ready yet."
            );

            return;

          }


          const oldButtonHTML =
            applyBtn.innerHTML;


          applyBtn.disabled =
            true;


          applyBtn.innerHTML =
            '<span class="spinner"></span>Processing...';


          try {

            /*
             * Give the WebView one frame to render
             * the processing state.
             */
            await new Promise(
              resolve =>
                requestAnimationFrame(
                  () => resolve()
                )
            );


            /*
             * Create the final image completely locally.
             */
            const blob =
              await createOutputBlob();


            if (
              !blob ||
              blob.size <= 0
            ) {

              throw new Error(
                "Generated image is empty."
              );

            }


            /*
             * Telegram/mobile compatible download.
             */
            await downloadFile(
              blob,
              "instapic_resized.jpg"
            );


            /*
             * Restore button.
             */
            applyBtn.innerHTML =
              '<i class="fa-solid fa-check mr-2"></i>' +
              "Downloaded";


            /*
             * Keep the result state visible briefly,
             * then restore normal button text.
             */
            setTimeout(
              () => {

                applyBtn.innerHTML =
                  oldButtonHTML;

              },
              1800
            );


          } catch (error) {

            console.error(
              "Image processing/download error:",
              error
            );


            /*
             * User cancellation of Web Share is NOT a
             * processing error.
             */
            if (
              !(
                error &&
                error.name ===
                  "AbortError"
              )
            ) {

              alert(
                "Could not download the image. Please try again."
              );

            }


            applyBtn.innerHTML =
              oldButtonHTML;

          } finally {

            applyBtn.disabled =
              false;

          }

        }
      );


      /* =====================================================
         CLEANUP
      ===================================================== */

      window.addEventListener(
        "beforeunload",
        () => {

          if (cropper) {

            cropper.destroy();

            cropper = null;

          }


          if (imageObjectURL) {

            URL.revokeObjectURL(
              imageObjectURL
            );

            imageObjectURL = null;

          }

        }
      );


    })();
  </script>

</body>
</html>
